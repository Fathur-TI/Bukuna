/**
 * Utilitas Validasi, Crop, Putar, dan Kompresi Gambar Otomatis di Browser (src/utils/imageCompress.js)
 * - Format yang didukung: JPG, PNG, WebP (maksimal 10MB)
 * - Kompresi otomatis via <canvas>: lebar maks 1280px, kualitas ±0.8, WebP/JPEG
 */

const ALLOWED_TYPES = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'];
const MAX_FILE_SIZE_BYTES = 10 * 1024 * 1024; // 10 MB

function validateImageFile(file) {
  if (!file) {
    return { valid: false, error: 'Pilih file gambar terlebih dahulu ya.' };
  }

  const fileType = (file.type || '').toLowerCase();
  const fileName = (file.name || '').toLowerCase();
  const hasAllowedExt =
    fileName.endsWith('.jpg') ||
    fileName.endsWith('.jpeg') ||
    fileName.endsWith('.png') ||
    fileName.endsWith('.webp');

  if (!ALLOWED_TYPES.includes(fileType) && !hasAllowedExt) {
    return {
      valid: false,
      error:
        'Format gambar belum didukung. Gunakan gambar berformat JPG, PNG, atau WebP ya!',
    };
  }

  if (file.size > MAX_FILE_SIZE_BYTES) {
    const sizeMb = (file.size / (1024 * 1024)).toFixed(1);
    return {
      valid: false,
      error: `Ukuran gambar terlalu besar (${sizeMb} MB). Maksimal ukuran gambar adalah 10 MB ya!`,
    };
  }

  return { valid: true, error: '' };
}

function loadImageFromSource(source) {
  return new Promise((resolve, reject) => {
    const img = new window.Image();
    let tempUrl = null;

    img.onload = () => {
      if (tempUrl) {
        try {
          URL.revokeObjectURL(tempUrl);
        } catch {
          // Abaikan
        }
      }
      resolve(img);
    };

    img.onerror = () => {
      if (tempUrl) {
        try {
          URL.revokeObjectURL(tempUrl);
        } catch {
          // Abaikan
        }
      }
      reject(new Error('Gambar tidak dapat dibaca. Coba pilih file gambar lain ya.'));
    };

    if (source instanceof Blob) {
      tempUrl = URL.createObjectURL(source);
      img.src = tempUrl;
    } else if (typeof source === 'string') {
      img.src = source;
    } else {
      reject(new Error('Sumber gambar tidak dikenali.'));
    }
  });
}

function canvasToBlob(canvas, mimeType, quality) {
  return new Promise((resolve) => {
    canvas.toBlob(
      (blob) => {
        resolve(blob);
      },
      mimeType,
      quality
    );
  });
}

/**
 * Memutar, memotong (crop) ke rasio sampul/halaman, dan mengompresi gambar ke Blob WebP/JPEG
 * @param {Blob|File|string} source
 * @param {Object} options
 * @param {number} [options.maxWidth=1280]
 * @param {number} [options.quality=0.8]
 * @param {number} [options.rotation=0] - 0, 90, 180, atau 270 derajat
 * @param {number|null} [options.aspectRatio=null] - Rasio lebar/tinggi (mis. 1 untuk sampul, 1.11 untuk halaman)
 * @param {number} [options.zoom=1] - Faktor zoom (1.0 - 2.5)
 * @param {number} [options.offsetX=0] - Geser horizontal (-0.5 s/d 0.5)
 * @param {number} [options.offsetY=0] - Geser vertikal (-0.5 s/d 0.5)
 * @param {function} [options.onProgress] - Callback progress (0 - 100)
 */
async function compressAndTransformImage(source, options = {}) {
  const {
    maxWidth = 1280,
    quality = 0.8,
    rotation = 0,
    aspectRatio = null,
    zoom = 1,
    offsetX = 0,
    offsetY = 0,
    onProgress = null,
  } = options;

  if (typeof onProgress === 'function') onProgress(15);

  const img = await loadImageFromSource(source);
  if (typeof onProgress === 'function') onProgress(45);

  const normRot = ((rotation % 360) + 360) % 360;
  const isSideways = normRot === 90 || normRot === 270;

  // Langkah 1: Gambar ke kanvas terotasi penuh terlebih dahulu
  const rotatedW = isSideways ? img.naturalHeight || img.height : img.naturalWidth || img.width;
  const rotatedH = isSideways ? img.naturalWidth || img.width : img.naturalHeight || img.height;

  const rotCanvas = document.createElement('canvas');
  rotCanvas.width = Math.max(1, rotatedW);
  rotCanvas.height = Math.max(1, rotatedH);
  const rotCtx = rotCanvas.getContext('2d');

  rotCtx.save();
  rotCtx.translate(rotCanvas.width / 2, rotCanvas.height / 2);
  rotCtx.rotate((normRot * Math.PI) / 180);
  rotCtx.drawImage(
    img,
    -(img.naturalWidth || img.width) / 2,
    -(img.naturalHeight || img.height) / 2
  );
  rotCtx.restore();

  if (typeof onProgress === 'function') onProgress(65);

  // Langkah 2: Hitung area potong (crop) sesuai rasio dan zoom
  const srcRatio = rotatedW / rotatedH;
  const targetRatio = aspectRatio && aspectRatio > 0 ? aspectRatio : srcRatio;

  let baseCropW = rotatedW;
  let baseCropH = rotatedH;

  if (srcRatio > targetRatio) {
    baseCropW = rotatedH * targetRatio;
    baseCropH = rotatedH;
  } else {
    baseCropW = rotatedW;
    baseCropH = rotatedW / targetRatio;
  }

  const safeZoom = Math.max(1, Math.min(3, Number(zoom) || 1));
  const cropW = baseCropW / safeZoom;
  const cropH = baseCropH / safeZoom;

  const maxShiftX = (rotatedW - cropW) / 2;
  const maxShiftY = (rotatedH - cropH) / 2;

  const centerX = rotatedW / 2 + Math.max(-1, Math.min(1, Number(offsetX) || 0)) * maxShiftX;
  const centerY = rotatedH / 2 + Math.max(-1, Math.min(1, Number(offsetY) || 0)) * maxShiftY;

  const sx = Math.max(0, Math.min(rotatedW - cropW, centerX - cropW / 2));
  const sy = Math.max(0, Math.min(rotatedH - cropH, centerY - cropH / 2));

  // Langkah 3: Skala ke lebar maksimum 1280px
  let outW = Math.round(cropW);
  let outH = Math.round(cropH);
  if (outW > maxWidth) {
    outW = maxWidth;
    outH = Math.round(maxWidth / targetRatio);
  }
  outW = Math.max(1, outW);
  outH = Math.max(1, outH);

  const outCanvas = document.createElement('canvas');
  outCanvas.width = outW;
  outCanvas.height = outH;
  const outCtx = outCanvas.getContext('2d');
  outCtx.imageSmoothingEnabled = true;
  outCtx.imageSmoothingQuality = 'high';
  outCtx.drawImage(rotCanvas, sx, sy, cropW, cropH, 0, 0, outW, outH);

  if (typeof onProgress === 'function') onProgress(85);

  // Utamakan WebP, fallback ke JPEG jika browser tidak mendukung encode WebP
  let blob = await canvasToBlob(outCanvas, 'image/webp', quality);
  if (!blob || blob.type !== 'image/webp') {
    blob = await canvasToBlob(outCanvas, 'image/jpeg', quality);
  }

  if (typeof onProgress === 'function') onProgress(100);

  return {
    blob,
    width: outW,
    height: outH,
  };
}



// === MODULE: src/hooks/useDebounce.js ===

function useDebounce(value, delay = 250) {
  const [debouncedValue, setDebouncedValue] = useState(value);

  useEffect(() => {
    const timer = setTimeout(() => {
      setDebouncedValue(value);
    }, delay);

    return () => clearTimeout(timer);
  }, [value, delay]);

  return debouncedValue;
}



// === MODULE: src/hooks/useAutosave.js ===

/**
 * Hook Penyimpanan Draf Otomatis (src/hooks/useAutosave.js)
 * - Menyimpan draf secara berkala saat ada perubahan yang belum disimpan
 * - Memasang peringatan beforeunload jika pengguna menutup tab sebelum tersimpan
 */
function useAutosave({ data, isDirty, onSave, intervalMs = 3500, enabled = true }) {
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const [isSaving, setIsSaving] = useState(false);
  const [autosaveError, setAutosaveError] = useState('');
  const latestDataRef = useRef(data);
  const latestOnSaveRef = useRef(onSave);

  useEffect(() => {
    latestDataRef.current = data;
  }, [data]);

  useEffect(() => {
    latestOnSaveRef.current = onSave;
  }, [onSave]);

  // Autosave berkala saat data kotor (isDirty)
  useEffect(() => {
    if (!enabled || !isDirty) return undefined;

    const timer = setTimeout(async () => {
      if (typeof latestOnSaveRef.current !== 'function') return;
      try {
        setIsSaving(true);
        setAutosaveError('');
        await latestOnSaveRef.current(latestDataRef.current, { silent: true });
        setLastSavedAt(new Date());
      } catch (err) {
        setAutosaveError(
          (err && err.message) || 'Gagal menyimpan draf otomatis. Periksa ruang penyimpanan peramban.'
        );
      } finally {
        setIsSaving(false);
      }
    }, intervalMs);

    return () => clearTimeout(timer);
  }, [data, isDirty, intervalMs, enabled]);

  // Peringatan sebelum menutup tab jika masih ada perubahan yang belum disimpan
  useEffect(() => {
    const handleBeforeUnload = (e) => {
      if (isDirty) {
        e.preventDefault();
        e.returnValue = 'Ada perubahan cerita yang belum disimpan. Yakin ingin keluar?';
        return e.returnValue;
      }
      return undefined;
    };

    window.addEventListener('beforeunload', handleBeforeUnload);
    return () => window.removeEventListener('beforeunload', handleBeforeUnload);
  }, [isDirty]);

  return {
    lastSavedAt,
    isSaving,
    autosaveError,
    setLastSavedAt,
  };
}



// === MODULE: src/hooks/useSpeech.js ===

const MUTE_STORAGE_KEY = 'bukuna_quiz_muted_v1';

function playToneSequence(notes) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!window.__bukunaAudioCtx) {
      window.__bukunaAudioCtx = new AudioCtx();
    }
    const ctx = window.__bukunaAudioCtx;
    if (ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    const now = ctx.currentTime;
    notes.forEach(({ freq, start, duration, type = 'sine', gain = 0.12 }) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now + start);
      g.gain.setValueAtTime(0.001, now + start);
      g.gain.exponentialRampToValueAtTime(gain, now + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + start + duration);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(now + start);
      osc.stop(now + start + duration + 0.02);
    });
  } catch {
    // Abaikan jika browser memblokir autoplay audio sebelum interaksi
  }
}

/**
 * Hook Web Speech API (id-ID) + Efek Nada Ramah Anak (src/hooks/useSpeech.js)
 * - Membacakan soal, petunjuk, dan pujian dalam Bahasa Indonesia (id-ID)
 * - Menyediakan tombol ulang suara (repeat) dan tombol bisukan (mute)
 */
function useSpeech() {
  const [isMuted, setIsMuted] = useState(() => {
    try {
      return localStorage.getItem(MUTE_STORAGE_KEY) === 'true';
    } catch {
      return false;
    }
  });

  const [isSpeaking, setIsSpeaking] = useState(false);
  const lastTextRef = useRef('');

  const stopSpeaking = useCallback(() => {
    try {
      if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    } catch {
      // Abaikan
    }
    setIsSpeaking(false);
  }, []);

  const speak = useCallback(
    (text, options = {}) => {
      const cleanText = String(text || '').trim();
      if (!cleanText) return false;
      lastTextRef.current = cleanText;

      if (typeof window !== 'undefined') {
        window.__LAST_SPOKEN_QUIZ_TEXT__ = cleanText;
        window.__SPEECH_CALL_COUNT__ = (window.__SPEECH_CALL_COUNT__ || 0) + 1;
      }

      if (isMuted && !options.ignoreMute) {
        setIsSpeaking(false);
        return false;
      }

      try {
        if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = 'id-ID';
          utterance.rate = options.rate || 0.94;
          utterance.pitch = options.pitch || 1.1;

          const voices = window.speechSynthesis.getVoices
            ? window.speechSynthesis.getVoices()
            : [];
          const idVoice = voices.find(
            (v) => v.lang && v.lang.toLowerCase().startsWith('id')
          );
          if (idVoice) {
            utterance.voice = idVoice;
          }

          utterance.onstart = () => setIsSpeaking(true);
          utterance.onend = () => setIsSpeaking(false);
          utterance.onerror = () => setIsSpeaking(false);

          setIsSpeaking(true);
          window.speechSynthesis.speak(utterance);
          return true;
        }
      } catch {
        setIsSpeaking(false);
      }
      return false;
    },
    [isMuted]
  );

  const repeatLast = useCallback(() => {
    if (lastTextRef.current) {
      return speak(lastTextRef.current);
    }
    return false;
  }, [speak]);

  const toggleMute = useCallback(() => {
    setIsMuted((prev) => {
      const next = !prev;
      try {
        localStorage.setItem(MUTE_STORAGE_KEY, String(next));
      } catch {
        // Abaikan
      }
      if (next) {
        try {
          if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
        } catch {
          // Abaikan
        }
        setIsSpeaking(false);
      }
      return next;
    });
  }, []);

  // Nada riang lembut saat jawaban benar (tanpa mengejutkan anak)
  const playCheerSound = useCallback(() => {
    if (isMuted) return;
    playToneSequence([
      { freq: 523.25, start: 0.0, duration: 0.12, type: 'triangle', gain: 0.12 }, // C5
      { freq: 659.25, start: 0.11, duration: 0.12, type: 'triangle', gain: 0.13 }, // E5
      { freq: 783.99, start: 0.22, duration: 0.24, type: 'triangle', gain: 0.15 }, // G5
    ]);
  }, [isMuted]);

  // Nada lembut saat mencoba lagi (BUKAN buzzer kasar!)
  const playGentleTrySound = useCallback(() => {
    if (isMuted) return;
    playToneSequence([
      { freq: 440.0, start: 0.0, duration: 0.14, type: 'sine', gain: 0.08 },

    ]);
  }, [isMuted]);

  const playFanfareSound = useCallback(() => {

// === MODULE: src/hooks/useQuiz.js ===

const PRAISE_MESSAGES = [
  'Hebat! Jawabanmu tepat sekali!',
  'Pintar sekali! Kamu berhasil!',
  'Wah, luar biasa! Ayo lanjut!',
  'Benar sekali! Rodri ikut senang!',
];

/**
 * Hook Logika Kuis Interaktif Anak Usia Dini (src/hooks/useQuiz.js)
 * - Tanpa batas waktu, tanpa skor negatif, tanpa kata "salah"
 * - Setelah 2 kali percobaan belum tepat pada satu soal, otomatis menyalakan petunjuk (showHint = true)
 * - Soal berikutnya muncul setelah anak menjawab benar
 * - Menghasilkan 1-3 bintang apresiasi (tidak pernah 0 bintang)
 */
function useQuiz(quiz, onCompleteQuiz) {
  const questions = useMemo(() => (quiz && Array.isArray(quiz.questions) ? quiz.questions : []), [quiz]);
  const totalQuestions = questions.length;

  const [stage, setStage] = useState('start'); // 'start' | 'question' | 'result'
  const [currentIndex, setCurrentIndex] = useState(0);
  const [attemptsOnCurrent, setAttemptsOnCurrent] = useState(0);
  const [totalExtraAttempts, setTotalExtraAttempts] = useState(0);
  const [triedOptionIds, setTriedOptionIds] = useState([]);
  const [feedbackState, setFeedbackState] = useState('idle'); // 'idle' | 'correct' | 'retry'
  const [feedbackMessage, setFeedbackMessage] = useState('');
  const [earnedStars, setEarnedStars] = useState(3);

  const currentQuestion = questions[currentIndex] || null;
  const showHint = attemptsOnCurrent >= 2;

  // Reset state kuis setiap kali berpindah ke kuis/cerita yang berbeda
  useEffect(() => {
    setStage('start');
    setCurrentIndex(0);
    setAttemptsOnCurrent(0);
    setTotalExtraAttempts(0);
    setTriedOptionIds([]);
    setFeedbackState('idle');
    setFeedbackMessage('');
  }, [quiz && quiz.id]);

  const mascotMood = useMemo(() => {
    if (stage === 'start') return 'idle';
    if (stage === 'result') return 'celebrate';
    if (feedbackState === 'correct') return 'happy';
    if (feedbackState === 'retry') return 'encouraging';
    return 'thinking';
  }, [stage, feedbackState]);

  const startQuiz = useCallback(() => {
    setCurrentIndex(0);
    setAttemptsOnCurrent(0);
    setTotalExtraAttempts(0);
    setTriedOptionIds([]);
    setFeedbackState('idle');
    setFeedbackMessage('');
    setStage('question');
  }, []);

  const submitAnswer = useCallback(
    (isCorrect, optionId = null) => {
      if (feedbackState === 'correct') return { status: 'already-correct' };

      if (isCorrect) {
        const praise = PRAISE_MESSAGES[currentIndex % PRAISE_MESSAGES.length];
        setFeedbackState('correct');
        setFeedbackMessage(praise);
        return { status: 'correct', message: praise };
      } else {
        const nextAttempts = attemptsOnCurrent + 1;
        setAttemptsOnCurrent(nextAttempts);
        setTotalExtraAttempts((prev) => prev + 1);
        if (optionId) {
          setTriedOptionIds((prev) => (prev.includes(optionId) ? prev : [...prev, optionId]));
        }
        const retryMsg =
          nextAttempts >= 2 && currentQuestion && currentQuestion.hint
            ? `Ayo coba lagi! Petunjuk: ${currentQuestion.hint}`
            : 'Ayo coba lagi! Kamu pasti bisa!';
        setFeedbackState('retry');
        setFeedbackMessage(retryMsg);
        return {
          status: 'retry',
          attempts: nextAttempts,
          showHint: nextAttempts >= 2,
          message: retryMsg,
        };
      }
    },
    [feedbackState, currentIndex, attemptsOnCurrent, currentQuestion]
  );

  const nextQuestion = useCallback(() => {
    if (currentIndex + 1 < totalQuestions) {
      setCurrentIndex((prev) => prev + 1);
      setAttemptsOnCurrent(0);
      setTriedOptionIds([]);
      setFeedbackState('idle');
      setFeedbackMessage('');
    } else {
      // Hitung bintang 1-3 (tidak pernah 0 bintang!)
      let stars = 3;
      if (totalExtraAttempts >= 5) {
        stars = 1;
      } else if (totalExtraAttempts >= 2) {
        stars = 2;
      }
      setEarnedStars(stars);
      setStage('result');
      if (onCompleteQuiz && quiz) {
        onCompleteQuiz({
          storyId: quiz.storyId || quiz.id,
          quizId: quiz.id,
          judul: quiz.judul,
          bintang: stars,
          totalSoal: totalQuestions,
          tanggal: new Date().toISOString(),
        });
      }
    }
  }, [currentIndex, totalQuestions, totalExtraAttempts, onCompleteQuiz, quiz]);

  const restartQuiz = useCallback(() => {
    setCurrentIndex(0);
    setAttemptsOnCurrent(0);
    setTotalExtraAttempts(0);
    setTriedOptionIds([]);
    setFeedbackState('idle');
    setFeedbackMessage('');
    setStage('question');
  }, []);

  return {
    stage,
    setStage,
    questions,
    totalQuestions,
    currentIndex,
    currentQuestion,
    attemptsOnCurrent,
    triedOptionIds,
    feedbackState,
    feedbackMessage,
    showHint,
    mascotMood,
    earnedStars,
    startQuiz,
    submitAnswer,
    nextQuestion,
    restartQuiz,
  };
}

  FAVORITES: 'bukuna_favorites_v1',
  COLLECTIONS: 'bukuna_collections_v1',
  HISTORY: 'bukuna_history_v1',
  QUIZ_RESULTS: 'bukuna_quiz_results_v1',
};

function readStorage(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

/**
 * Membangun himpunan ID cerita aktif yang valid (cerita katalog Supabase/bawaan + seluruh cerita buatan pengguna)
 * serta himpunan ID kuis yang valid, lalu membersihkan referensi ke cerita yang sudah dihapus.
 */
function buildValidIdSets(userStories = [], catalogList = initialStories) {
  const validStoryIds = new Set(initialStories.map((s) => s.id));
  (catalogList || []).forEach((s) => {
    if (s && s.id) validStoryIds.add(s.id);
    if (s && s.slug) validStoryIds.add(s.slug);
  });
  (userStories || []).forEach((s) => {
    if (s && s.id) validStoryIds.add(s.id);
  });

  const validQuizIds = new Set();
  validStoryIds.forEach((id) => {
    validQuizIds.add(id);
    validQuizIds.add(`kuis-${id}`);
  });
  ALL_QUIZZES.forEach((q) => {
    if (q && q.id) validQuizIds.add(q.id);
    if (q && q.storyId) validQuizIds.add(q.storyId);
  });

  return { validStoryIds, validQuizIds };
}

function sanitizeIdList(list, validStoryIds) {
  if (!Array.isArray(list)) return [];
  const seen = new Set();
  return list.filter((id) => {
    if (typeof id !== 'string' || !validStoryIds.has(id) || seen.has(id)) {
      return false;
    }
    seen.add(id);
    return true;
  });
}

function sanitizeHistoryMap(historyObj, validStoryIds) {
  if (!historyObj || typeof historyObj !== 'object' || Array.isArray(historyObj)) {
    return {};
  }
  const cleaned = {};
  Object.entries(historyObj).forEach(([key, val]) => {
    const sid = (val && val.storyId) || key;
    if (validStoryIds.has(sid) && val && typeof val === 'object') {
      cleaned[sid] = { ...val, storyId: sid };
    }
  });
  return cleaned;
}

function sanitizeQuizResultsList(resultsList, validQuizIds) {
  if (!Array.isArray(resultsList)) return [];
  return resultsList.filter(
    (r) =>
      r &&
      typeof r === 'object' &&
      (validQuizIds.has(r.storyId) || validQuizIds.has(r.quizId))
  );
}

function formatReviewDate(isoStr) {
  try {
    const d = new Date(isoStr);
    if (Number.isNaN(d.getTime())) return 'Baru saja';
    return d.toLocaleDateString('id-ID', {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
    });
  } catch {
    return 'Baru saja';
  }
}

 * - Ditempatkan eksklusif di bagian paling bawah halaman Detail Cerita & Halaman Membaca
 *   (setelah konten utama cerita selesai) agar tidak mengganggu fokus membaca anak.
 * - Terintegrasi dengan tabel `story_comments` (termasuk kolom `parent_id` untuk fitur Reply)
 *   dan join ke `profiles` di Supabase.
 * - Struktur Data & Tampilan Balasan:
 *   • Ulasan utama (`parent_id === null`) diurutkan dari yang terbaru (`created_at` descending).
 *   • Komentar balasan (`parent_id !== null`) ditampilkan menjorok ke dalam (indented) tepat di bawah
 *     kartu ulasan utama yang dibalas, diurutkan dari balasan terlama ke terbaru (`created_at` ascending).
 * - Interaksi Balas Komentar:
 *   • Tombol "Balas" pada setiap kartu ulasan utama (hanya muncul jika user sudah login).
 *   • Form input balasan ringkas di bawah ulasan tersebut (tanpa rating bintang) disertai pengingat bahasa santun.
 *   • Tombol "Hapus" pada ulasan utama maupun balasan milik user yang sedang login (`user.id === item.user_id`).

  const [comments, setComments] = useState([]);
  const [loading, setLoading] = useState(true);
  const [rating, setRating] = useState(5);
  const [hoverRating, setHoverRating] = useState(0);
  const [commentText, setCommentText] = useState('');
  const [formError, setFormError] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [deletingId, setDeletingId] = useState(null);

  // State untuk Balas Komentar (Reply)

  const [replyText, setReplyText] = useState('');

  const loadComments = useCallback(async () => {
    if (!storyId) return;

      const res = await fetchStoryComments(storyId);
      if (res && Array.isArray(res.comments)) {
        setComments(res.comments);

      setLoading(false);

      }

    }

      comment: trimmed,
      created_at: new Date().toISOString(),
      author_name: authorName,
      author_role: user.peran || 'guru',

    setReplyText('');
    setActiveReplyParentId(null);

    try {
      const res = await addStoryComment({
        storyId,
        user,
        rating: null,
        comment: trimmed,
        parentId: parentComment.id,
      });

      if (!res || !res.ok) {
        setComments((prev) => prev.filter((item) => item.id !== tempReplyId));
        setActiveReplyParentId(parentComment.id);
        setReplyText(trimmed);
        setReplyError(
          (res && res.error) || 'Gagal mengirim balasan komentar. Silakan coba lagi.'
        );
        return;
      }

      if (res.comment) {
        setComments((prev) =>
          prev.map((item) => (item.id === tempReplyId ? res.comment : item))

      }

      if (showToast) {

      }
    } finally {
      setSubmittingReply(false);
    }
  };

    }

const PRESET_DISTRACTOR_IMAGES = [
  { value: 'sky-balloons', label: 'Ilustrasi: Balon Udara Ceria' },
  { value: 'cloud-ship', label: 'Ilustrasi: Kapal Awan Malam' },
  { value: 'rabbit-garden', label: 'Ilustrasi: Kebun Kelinci' },
  { value: 'river-clean', label: 'Ilustrasi: Sungai Jernih' },
  { value: 'family-home', label: 'Ilustrasi: Rumah Hangat' },
  { value: 'ants-team', label: 'Ilustrasi: Semut Bergotong Royong' },
  { value: 'cat-magic-forest', label: 'Ilustrasi: Kucing di Hutan Ajaib' },
];

function extractSceneShortLabel(page, idx, fallbackText) {
  if (page && typeof page.alt === 'string' && page.alt.trim()) {
    return page.alt.trim().slice(0, 48);
  }
  if (page && typeof page.teks === 'string' && page.teks.trim()) {
    const firstSentence = page.teks
      .trim()
      .split(/[.!?]/)[0]
      .trim();
    if (firstSentence) {
      return firstSentence.length > 44
        ? `${firstSentence.slice(0, 44)}...`
        : firstSentence;
    }
  }
  return fallbackText || `Adegan Halaman ${idx + 1}`;
}

/**
 * Menghasilkan otomatis 3 soal kuis interaktif (2 Pilih Gambar + 1 Urutkan Kejadian)
 * langsung dari gambar & teks halaman cerita buatan pengguna.
 */
function generateAutoQuizFromStory(storyData) {
  const judul =
    storyData && storyData.judul && storyData.judul.trim()
      ? storyData.judul.trim()
      : 'Cerita Buatanku';
  const coverImg = (storyData && storyData.cover) || 'cat-magic-forest';
  const pages =
    storyData && Array.isArray(storyData.pages) && storyData.pages.length > 0
      ? storyData.pages
      : [{ id: 'hal-1', halaman: 1, gambar: coverImg, teks: '', alt: '' }];

  const firstPage = pages[0];
  const midIdx = Math.floor((pages.length - 1) / 2);
  const midPage = pages[midIdx] || firstPage;
  const lastIdx = pages.length - 1;
  const lastPage = pages[lastIdx] || firstPage;

  const firstImg = (firstPage && firstPage.gambar) || coverImg;
  const midImg = (midPage && midPage.gambar) || coverImg;
  const lastImg = (lastPage && lastPage.gambar) || coverImg;

  const firstLabel = extractSceneShortLabel(firstPage, 0, 'Awal Cerita');
  const midLabel = extractSceneShortLabel(midPage, midIdx, 'Tengah Cerita');
  const lastLabel = extractSceneShortLabel(lastPage, lastIdx, 'Akhir Cerita');

  const now = Date.now();

  const q1 = {
    id: `q-usr-${now}-1`,
    type: 'pick-image',
    prompt: `Gambar mana yang muncul pada awal cerita "${judul}"?`,
    voiceText: `Gambar mana yang muncul pada awal cerita ${judul}?`,
    hint: `Ingat kembali gambar pada halaman pertama cerita "${judul}" tadi ya!`,
    options: [
      {
        id: `opt-${now}-1a`,
        label: firstLabel,
        gambar: firstImg,
        emoji: '📖',
        isCorrect: true,
      },
      {
        id: `opt-${now}-1b`,
        label: 'Balon Terbang di Awan',
        gambar: 'sky-balloons',
        emoji: '🎈',
        isCorrect: false,
      },
      {
        id: `opt-${now}-1c`,
        label: 'Kapal Layar Samudra',
        gambar: 'cloud-ship',
        emoji: '⛵',
        isCorrect: false,
      },
    ],
  };

  const q2 = {
    id: `q-usr-${now}-2`,
    type: 'pick-image',
    prompt: `Gambar mana yang menceritakan bagian akhir dari "${judul}"?`,
    voiceText: `Gambar mana yang menceritakan bagian akhir dari ${judul}?`,
    hint: `Lihat gambar yang ada di halaman terakhir cerita "${judul}" ya!`,
    options: [
      {
        id: `opt-${now}-2a`,
        label: 'Taman Kelinci Wortel',
        gambar: 'rabbit-garden',
        emoji: '🐰',
        isCorrect: false,
      },
      {
        id: `opt-${now}-2b`,
        label: lastLabel,
        gambar: lastImg,
        emoji: '🌟',
        isCorrect: true,
      },
      {
        id: `opt-${now}-2c`,
        label: 'Sungai Hutan Hijau',
        gambar: 'river-clean',
        emoji: '🏞️',
        isCorrect: false,
      },
    ],
  };

  const q3 = {
    id: `q-usr-${now}-3`,
    type: 'order-story',
    prompt: `Susun 3 gambar kejadian cerita "${judul}" dari awal sampai selesai ya!`,
    voiceText: `Susun tiga gambar kejadian cerita ${judul} dari awal sampai selesai ya!`,
    hint: `Urutkan dari kejadian halaman awal (1), halaman tengah (2), lalu halaman akhir (3) ya!`,
    sequence: [
      {
        id: `seq-${now}-1`,
        label: firstLabel,
        gambar: firstImg,
        emoji: '1️⃣',
        correctOrder: 1,
      },
      {
        id: `seq-${now}-2`,
        label: midLabel,
        gambar: midImg,
        emoji: '2️⃣',
        correctOrder: 2,
      },
      {
        id: `seq-${now}-3`,
        label: lastLabel,
        gambar: lastImg,
        emoji: '3️⃣',
        correctOrder: 3,
      },
    ],
  };

  return {
    judul: `Kuis ${judul}`,
    questions: [q1, q2, q3],
  };
}

  };

      setError('Mohon isi alamat Email terlebih dahulu.');

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(trimmedEmail)) {
      setError('Format alamat Email belum valid (contoh: nama@email.com).');
      return;

      setError('Kata Sandi minimal terdiri dari 8 karakter agar akunmu aman.');
      return;

function formatQuizDate(isoStr) {
  try {
    const d = new Date(isoStr);
    if (Number.isNaN(d.getTime())) return 'Baru saja';
    return d.toLocaleDateString('id-ID', {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
    });
  } catch {
    return 'Baru saja';
  }
}

const WORKING_DRAFT_KEY = 'bukuna_working_draft_id_v1';

function createInitialStoryState(authorName) {
  const nowId = `cerita-ku-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
  return {
    id: nowId,
    judul: '',
    kategori: 'Petualangan',
    usia: '4-5 Tahun',
    sinopsis: '',
    cover: 'cat-magic-forest',
    coverAlt: '',
    pages: [
      {
        id: `hal-1-${Date.now()}`,
        halaman: 1,
        gambar: '',
        teks: '',
        alt: '',
      },
    ],
    quiz: null,
    status: 'draf',
    penulis: authorName || 'Guru & Orang Tua Bukuna',
    sumber: 'pengguna',
  };
}

/**
 * Halaman Buat Cerita Baru — Wizard 3 Langkah (src/pages/CreateStory.jsx)
 * 1. Info Cerita
 * 2. Halaman Cerita (1-30 halaman, gambar + teks WYSIWYG, tambah/hapus/duplikat/urutkan)
 * 3. Pratinjau & Simpan (Simpan sebagai Draf / Terbitkan)
 */
function CreateStory({ editStoryId = null }) {
  const navigate = useNavigate();
  const {
    user,
    createUserStory,
    updateUserStory,
    showToast,
  } = useBukuna();

  const [storyData, setStoryData] = useState(() => {
    if (editStoryId) {
      const existing = getStoryById(editStoryId);
      if (existing) return existing;
    }
    try {
      const savedDraftId = sessionStorage.getItem(WORKING_DRAFT_KEY);
      if (savedDraftId) {
        const draft = getStoryById(savedDraftId);
        if (draft && draft.status === 'draf') {
          return draft;
        }
      }
    } catch {
      // Abaikan
    }
    return createInitialStoryState(user && user.name);
  });

  const [step, setStep] = useState(1); // 1: Info, 2: Halaman, 3: Pratinjau
  const [activePageIndex, setActivePageIndex] = useState(0);
  const [errors, setErrors] = useState({});
  const [isDirty, setIsDirty] = useState(false);
  const [hasSavedOnce, setHasSavedOnce] = useState(() => Boolean(editStoryId));
  const [showLeaveConfirm, setShowLeaveConfirm] = useState(false);
  const [quotaError, setQuotaError] = useState('');

  // Jika editStoryId berubah, muat ulang data cerita
  useEffect(() => {
    if (editStoryId) {
      const found = getStoryById(editStoryId);
      if (found) {
        setStoryData(found);
        setHasSavedOnce(true);
      }
    }
  }, [editStoryId]);

  const persistStory = useCallback(
    async (dataToSave, options = { silent: false, forceStatus: null }) => {
      const nextStatus = options.forceStatus || dataToSave.status || 'draf';
      const payload = {
        ...dataToSave,
        judul: (dataToSave.judul || '').trim() || 'Draf Cerita Baru',
        status: nextStatus,
        penulis: dataToSave.penulis || (user && user.name) || 'Guru & Orang Tua Bukuna',
      };

      try {
        setQuotaError('');
        const exists = getStoryById(payload.id);
        let saved;
        if (exists || hasSavedOnce) {
          saved = await updateUserStory(payload.id, payload);
        } else {
          saved = createUserStory(payload);
          setHasSavedOnce(true);
        }
        if (!editStoryId && nextStatus === 'draf') {
          try {
            sessionStorage.setItem(WORKING_DRAFT_KEY, saved.id);
          } catch {
            // Abaikan
          }
        }
        setIsDirty(false);
        return saved;
      } catch (err) {
        if (err && err.isQuotaError) {
          setQuotaError(err.message);
        }
        throw err;
      }
    },
    [user, hasSavedOnce, updateUserStory, createUserStory, editStoryId]
  );

  // Autosave draf berkala saat pengguna mengetik atau mengubah gambar
  const { lastSavedAt, isSaving, autosaveError } = useAutosave({
    data: storyData,
    isDirty:
      isDirty &&
      Boolean(
        (storyData.judul && storyData.judul.trim()) ||
          storyData.pages.some((p) => p.teks || p.gambar)
      ),
    onSave: (currentData) =>
      persistStory(currentData, {
        silent: true,
        forceStatus: editStoryId ? currentData.status : 'draf',
      }),
    intervalMs: 3000,
    enabled: true,
  });

  const handleFieldChange = (field, value) => {
    setStoryData((prev) => ({
      ...prev,
      [field]: typeof value === 'function' ? value(prev[field]) : value,
    }));
    setIsDirty(true);
    if (errors[field]) {
      setErrors((prev) => ({ ...prev, [field]: '' }));
    }
  };

  const handleUpdatePageField = (pageIdx, field, value) => {
    setStoryData((prev) => {
      const nextPages = prev.pages.map((p, idx) =>
        idx === pageIdx ? { ...p, [field]: value } : p
      );
      return { ...prev, pages: nextPages };
    });
    setIsDirty(true);
  };

  const handleAddPage = () => {
    setStoryData((prev) => {
      if (prev.pages.length >= 30) return prev;
      const newPage = {
        id: `hal-${prev.pages.length + 1}-${Date.now()}`,
        halaman: prev.pages.length + 1,
        gambar: '',
        teks: '',
        alt: '',
      };
      const nextPages = [...prev.pages, newPage];
      setActivePageIndex(nextPages.length - 1);
      return { ...prev, pages: nextPages };
    });
    setIsDirty(true);
  };

  const handleDuplicatePage = (pageIdx) => {
    setStoryData((prev) => {
      if (prev.pages.length >= 30) return prev;
      const source = prev.pages[pageIdx];
      if (!source) return prev;
      const copy = {
        ...source,
        id: `hal-dup-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
      };
      const nextPages = [
        ...prev.pages.slice(0, pageIdx + 1),
        copy,
        ...prev.pages.slice(pageIdx + 1),
      ].map((p, i) => ({ ...p, halaman: i + 1 }));
      setActivePageIndex(pageIdx + 1);
      return { ...prev, pages: nextPages };
    });
    setIsDirty(true);
    showToast(`Halaman ${pageIdx + 1} berhasil diduplikat.`);
  };

  const handleDeletePage = (pageIdx) => {
    setStoryData((prev) => {
      if (prev.pages.length <= 1) return prev;
      const nextPages = prev.pages
        .filter((_, idx) => idx !== pageIdx)
        .map((p, i) => ({ ...p, halaman: i + 1 }));
      const nextActive = Math.min(activePageIndex, nextPages.length - 1);
      setActivePageIndex(Math.max(0, nextActive));
      return { ...prev, pages: nextPages };
    });
    setIsDirty(true);
    showToast(`Halaman ${pageIdx + 1} telah dihapus.`);
  };

  const handleMovePage = (fromIdx, toIdx) => {
    setStoryData((prev) => {
      if (
        fromIdx < 0 ||
        toIdx < 0 ||
        fromIdx >= prev.pages.length ||
        toIdx >= prev.pages.length
      ) {
        return prev;
      }
      const copy = [...prev.pages];
      const [moved] = copy.splice(fromIdx, 1);
      copy.splice(toIdx, 0, moved);

  const { storyId } = useParams();
  const navigate = useNavigate();

  const quiz = getQuizForStory(storyId);
  const story = getAnyStoryById(storyId);

  const {
    speak,
    stopSpeaking,
    toggleMute,
    isMuted,
    playCheerSound,
    playGentleTrySound,
    playFanfareSound,
  } = useSpeech();

  const handleCompleteQuiz = useCallback(
    (resultData) => {
      saveQuizResult(resultData);
      playFanfareSound();
      speak(`Hore! Kamu hebat sekali dan mendapatkan ${resultData.bintang} bintang emas!`);
      showToast(`Kuis selesai! Kamu mendapatkan ${resultData.bintang} Bintang ⭐`);

    nextQuestion,
    restartQuiz,

    if (stage === 'question' && currentQuestion && currentQuestion.prompt) {

    } else if (res.status === 'retry') {

      speak(res.message);

/**
 * Halaman 11: Selesai Membaca (sesuai File 1 Halaman 5 kiri)
 * - Logo bukuna di kiri atas
 * - Teks besar "HORE!"
 * - Subteks "Kamu sudah menyelesaikan cerita [judul]"
 * - Gambar / sampul cerita di tengah
 * - Tombol "Kembali Ke Daftar Cerita"
 * - Tombol "Bagikan Cerita" (Web Share API + fallback salin link / ekspor .json untuk cerita pengguna)
 * - Dua tombol bawah: "Favorit" dan "Koleksi"
 * - Animasi konfeti ringan
 */
function FinishStoryPage() {
  const { id } = useParams();
  const navigate = useNavigate();
  const {
    getAnyStoryById,
    isFavorite,
    toggleFavorite,
    isInCollection,
    toggleCollection,
    hasQuizForStory,
    exportUserStory,
    showToast,
  } = useBukuna();

  const story = getAnyStoryById(id);
  const fav = isFavorite(story.id);
  const inCol = isInCollection(story.id);
  const isUserStory = story.sumber === 'pengguna';
  const hasQuiz = hasQuizForStory ? hasQuizForStory(story.id) : false;

  const handleShare = async () => {
    const shareUrl = `${window.location.origin}/cerita/${story.id}`;
    const shareData = {
      title: `Bukuna: ${story.judul}`,
      text: `Aku baru saja menyelesaikan cerita "${story.judul}" di BUKUNA! Yuk baca bersama!`,
      url: shareUrl,
    };

    if (navigator.share) {
      try {
        await navigator.share(shareData);
        showToast('Cerita berhasil dibagikan!');
        return;
      } catch {
        // Jika pengguna membatalkan dialog share atau gagal, lanjutkan fallback
      }
    }

    try {
      await navigator.clipboard.writeText(`${shareData.text} ${shareUrl}`);
      showToast('Tautan cerita berhasil disalin ke papan klip!');
    } catch {
      showToast(`Tautan cerita: ${shareUrl}`);
    }
  };

  const handleExportJson = async () => {
    try {
      const jsonStr = await exportUserStory(story.id);
      window.__LAST_EXPORTED_STORY_JSON__ = jsonStr;
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${story.id}.bukuna.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => {
        try {
          URL.revokeObjectURL(url);
        } catch {
          // Abaikan
        }
      }, 1500);
      showToast('File cadangan cerita (.json) berhasil diunduh!');
    } catch {
      showToast('Gagal mengekspor file cerita.');
    }

function formatDateId(isoStr) {
  try {
    const d = new Date(isoStr);
    if (Number.isNaN(d.getTime())) return 'Baru saja';
    return d.toLocaleDateString('id-ID', {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
    });
  } catch {
    return 'Baru saja';
  }
}
