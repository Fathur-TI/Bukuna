:root {
  --bg-teal-dark: #007A78;
  --bg-teal-darker: #005E5C;
  --bg-teal-light: #1FAFAA;
  --bg-teal-nav: #159A95;
  --accent-orange: #E07030;
  --accent-orange-hover: #C95B1E;
  --accent-orange-light: #F59256;
  --text-cream: #FFE9B0;
  --text-dark: #062D2C;
  --font-heading: 'Fredoka', sans-serif;
  --font-body: var(--font-heading);
  --font-story: 'Andika', sans-serif;

  /* Token ukuran subteks responsif (clamp) */
  --text-sub-hero: clamp(1rem, 2.5vw, 1.25rem);
  --text-sub-section: clamp(0.9375rem, 2.2vw, 1.125rem);
  --text-sub-body: clamp(1rem, 2.2vw, 1.125rem);
  --text-label: clamp(0.875rem, 1.8vw, 0.9375rem);
  --text-chip: 0.875rem;
  --text-form-label: clamp(0.9375rem, 2vw, 1rem);
  --text-help: clamp(0.875rem, 1.8vw, 0.9375rem);
  --text-nav: clamp(0.75rem, 1.6vw, 0.8125rem);

  /* Token warna per kata untuk judul (<ColorfulTitle />) */
  --title-1: #FFE9B0;
  --title-2: #A8E063;
  --title-3: #8FD8FF;
  --title-4: #FFB3C7;
  --title-pill-bg: #D9651F;
}

@layer base {
  html, body {
    background-color: var(--bg-teal-dark);
    color: #FFFFFF;
    font-family: var(--font-heading);
    font-weight: 500;
    line-height: 1.55;
    overflow-x: hidden;
    scroll-behavior: smooth;
    max-width: 100vw;
  }

  .grid > * {
    min-width: 0;
  }

  h1, h2, h3, h4, .font-heading {
    font-family: var(--font-heading);
  }

  input, textarea, select {
    font-family: var(--font-heading);
    font-weight: 500;
  }

  input::placeholder, textarea::placeholder {
    font-family: var(--font-heading);
    font-weight: 500;
    font-size: var(--text-help);
    line-height: 1.5;
  }
}

/* Font khusus Andika untuk Isi Cerita, Balon Ucapan Maskot, dan Soal Kuis */

  font-family: var(--font-story) !important;
}

/* === Judul Hero & Bagian Berwarna-Warni (<ColorfulTitle />) === */
.bukuna-colorful-title {
  line-height: 1.4 !important;
}

.bukuna-hero-title-wrap {
  max-width: 11.4ch;
}

.bukuna-title-word {
  display: inline-block;
  font-family: inherit;
  font-weight: inherit;
  font-size: inherit;
  letter-spacing: inherit;
  line-height: 1.08;
  text-shadow: 0 2px 4px rgba(4, 34, 33, 0.45);
}

.bukuna-title-word-pending {
  opacity: 0;
  transform: translateY(14px) scale(0.85);
}

.bukuna-title-word-enter {
  animation-name: bukunaTitleWordIn;
  animation-duration: 0.5s;
  animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
  animation-fill-mode: both;
  will-change: transform, opacity;
}

.bukuna-title-word-done {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.bukuna-title-color-1 { color: var(--title-1); }
.bukuna-title-color-2 { color: var(--title-2); }
.bukuna-title-color-3 { color: var(--title-3); }
.bukuna-title-color-4 { color: var(--title-4); }

.bukuna-word-delay-0 { animation-delay: 0s; }
.bukuna-word-delay-1 { animation-delay: 0.14s; }
.bukuna-word-delay-2 { animation-delay: 0.28s; }
.bukuna-word-delay-3 { animation-delay: 0.42s; }
.bukuna-word-delay-4 { animation-delay: 0.56s; }
.bukuna-word-delay-5 { animation-delay: 0.70s; }
.bukuna-word-delay-6 { animation-delay: 0.84s; }
.bukuna-word-delay-7 { animation-delay: 0.98s; }

/* Sorotan pil oranye untuk kata "Dunia" */
.bukuna-title-pill {
  display: inline-block;
  background-color: var(--title-pill-bg);
  color: #FFFFFF;
  padding: 0.02em 12px 0.05em 12px;
  border-radius: 14px;
  line-height: 1.08;
  transform: rotate(-2deg);
  cursor: pointer;
  user-select: none;
  font-family: inherit;
  font-weight: inherit;
  font-size: inherit;
  letter-spacing: inherit;
  box-shadow: 0 4px 10px rgba(0, 30, 29, 0.28);
  text-shadow: none;
  will-change: transform;
}

.bukuna-title-pill-idle {
  animation: bukunaPillPeriodicWobble 3.5s ease-in-out 1.1s infinite;
}

.bukuna-title-pill-clicked {
  animation: bukunaPillTapWobble 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1;
}

/* Subteks hero muncul memudar setelah semua kata judul tampil */
.bukuna-hero-sub-enter {
  animation: bukunaHeroSubFadeIn 0.45s ease-out 0.98s both;
}

@keyframes bukunaTitleWordIn {
  0% {
    opacity: 0;
    transform: translateY(14px) scale(0.85);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Bergoyang pelan (~0.5s dari siklus 3.5s) dari -2deg ke -5deg ke 2deg ke -2deg, scale hingga 1.06 */
@keyframes bukunaPillPeriodicWobble {
  0% {
    transform: rotate(-2deg) scale(1);
  }
  4.5% {
    transform: rotate(-5deg) scale(1.06);
  }
  9.5% {
    transform: rotate(2deg) scale(1.06);
  }
  14.3% {
    transform: rotate(-2deg) scale(1);
  }
  100% {
    transform: rotate(-2deg) scale(1);
  }
}

/* Goyang lebih besar sekali (±0.5s) saat kata "Dunia" diketuk/diklik */
@keyframes bukunaPillTapWobble {
  0% {
    transform: rotate(-2deg) scale(1);
  }
  25% {
    transform: rotate(-9deg) scale(1.14);
  }
  55% {
    transform: rotate(6deg) scale(1.12);
  }
  80% {
    transform: rotate(-5deg) scale(1.06);
  }
  100% {
    transform: rotate(-2deg) scale(1);
  }
}

@keyframes bukunaHeroSubFadeIn {
  0% {
    opacity: 0;
    transform: translateY(8px);
  }

// === MODULE: src/lib/supabaseClient.js ===

/**
 * Inisialisasi Klien Supabase BUKUNA (/src/lib/supabaseClient.js)
 * - Membaca VITE_SUPABASE_URL dan VITE_SUPABASE_ANON_KEY (mendukung publishable key sb_publishable_...)
 * - Jika variabel lingkungan kosong atau dijalankan dari file:// (preview.html),
 *   otomatis beralih ke Mode Demo tanpa melempar error.
 */

function readViteEnv() {
  try {
    // Mendukung Vite (import.meta.env) maupun fallback global jika dijalankan di preview.html
    const metaEnv =
      typeof import.meta !== 'undefined' && import.meta.env
        ? import.meta.env
        : {};
    const winEnv =
      typeof window !== 'undefined' && window.__BUKUNA_ENV__
        ? window.__BUKUNA_ENV__
        : {};

    const url = String(
      metaEnv.VITE_SUPABASE_URL || winEnv.VITE_SUPABASE_URL || ''
    ).trim();
    const anonKey = String(
      metaEnv.VITE_SUPABASE_ANON_KEY || winEnv.VITE_SUPABASE_ANON_KEY || ''
    ).trim();

    return { url, anonKey };
  } catch {
    return { url: '', anonKey: '' };
  }
}

const { url: supabaseUrl, anonKey: supabaseAnonKey } = readViteEnv();

const isFileProtocol =
  typeof window !== 'undefined' &&
  window.location &&
  window.location.protocol === 'file:';

const isSupabaseConfigured = Boolean(
  !isFileProtocol &&
    supabaseUrl &&
    supabaseAnonKey &&
    supabaseUrl.startsWith('http')
);

const supabase =
  isSupabaseConfigured && typeof createClient === 'function'
    ? createClient(supabaseUrl, supabaseAnonKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          storageKey: 'bukuna_supabase_auth_v1',
        },
      })
    : null;


// === MODULE: src/services/authService.js ===

/**
 * Lapisan Layanan Autentikasi BUKUNA (/src/services/authService.js)
 * - Komponen UI tidak memanggil Supabase secara langsung, melainkan melalui fungsi di modul ini.
 * - Menyediakan fungsi: daftar (registerWithEmail), masuk (loginWithEmail), keluar (logoutUser),
 *   lupa kata sandi (sendPasswordReset), ambil sesi (getCurrentSessionUser),
 *   pembaruan kata sandi saat reset (updateUserPassword), dan langganan perubahan sesi (subscribeAuthChanges).
 * - Jika VITE_SUPABASE_URL kosong atau server Supabase tidak dapat dihubungi (offline/preview.html),
 *   otomatis beralih ke Mode Demo (simulasi lokal) secara mulus.
 */

const DEMO_STORAGE_KEYS = {
  USER: 'bukuna_demo_user_v1',
  USERS_DB: 'bukuna_users_db_v1',
};

let runtimeConnectionFailed = false;

function isAuthInDemoMode() {
  return !isSupabaseConfigured || runtimeConnectionFailed || !supabase;
}

function isNetworkOrFetchError(err) {
  if (!err) return false;
  const msg = String(err.message || err.error_description || err).toLowerCase();
  return (
    msg.includes('failed to fetch') ||
    msg.includes('networkerror') ||
    msg.includes('network request failed') ||
    msg.includes('load failed') ||
    msg.includes('err_name_not_resolved') ||
    msg.includes('fetch')
  );
}

/**
 * Menerjemahkan pesan error Supabase Auth ke Bahasa Indonesia yang ramah untuk guru & orang tua
 */
function translateAuthError(err) {
  if (!err) return 'Terjadi kendala saat memproses akun. Silakan coba lagi ya.';
  const raw = String(err.message || err.error_description || err).trim();
  const lower = raw.toLowerCase();

  if (
    lower.includes('invalid login credentials') ||
    lower.includes('invalid_credentials') ||
    lower.includes('invalid email or password')
  ) {
    return 'Email atau Kata Sandi belum tepat. Silakan periksa kembali atau klik "Lupa kata sandi?".';
  }
  if (lower.includes('email not confirmed')) {
    return 'Email Anda belum dikonfirmasi. Silakan buka kotak masuk email Anda dan klik tautan verifikasi terlebih dahulu.';
  }
  if (
    lower.includes('user already registered') ||
    lower.includes('already been registered') ||
    lower.includes('already exists')
  ) {
    return 'Alamat email ini sudah terdaftar. Silakan masuk menggunakan halaman Masuk atau gunakan fitur Lupa Kata Sandi.';
  }
  if (
    lower.includes('password should be at least') ||
    lower.includes('weak_password')
  ) {
    return 'Kata Sandi minimal harus terdiri dari 8 karakter.';
  }
  if (
    lower.includes('unable to validate email address') ||
    lower.includes('invalid format') ||
    lower.includes('anonymous_provider_disabled')
  ) {
    return 'Format alamat Email belum valid (contoh: nama@email.com).';
  }
  if (
    lower.includes('rate limit') ||
    lower.includes('too many requests') ||
    lower.includes('over_email_send_rate_limit') ||
    lower.includes('for security purposes, you can only request this')
  ) {
    return 'Terlalu banyak permintaan dalam waktu singkat. Mohon tunggu sekitar 1 menit sebelum mencoba kembali.';
  }
  if (isNetworkOrFetchError(err)) {
    return 'Tidak dapat terhubung ke layanan akun. Periksa koneksi internet Anda dan coba lagi.';
  }

  return raw || 'Terjadi kendala saat memproses permintaan akun Anda.';
}

function readLocalJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function writeLocalJson(key, value) {
  try {
    if (value === null || value === undefined) {
      localStorage.removeItem(key);
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  } catch {
    // Abaikan jika penyimpanan lokal penuh
  }
}

function buildNormalizedUser(authUser, profileRow = null) {
  if (!authUser) return null;
  const meta = authUser.user_metadata || {};
  const displayName =
    (profileRow && (profileRow.nama_akun || profileRow.full_name || profileRow.nama || profileRow.name)) ||
    meta.nama_akun ||
    meta.full_name ||
    meta.nama ||
    meta.name ||
    (authUser.email ? authUser.email.split('@')[0] : 'Sahabat Bukuna');

  const rawRole =
    (profileRow && (profileRow.role || profileRow.peran)) ||
    meta.role ||
    meta.peran ||
    'guru';

  const isAdmin =
    String(profileRow?.role || '').toUpperCase() === 'ADMIN' ||
    String(profileRow?.peran || '').toUpperCase() === 'ADMIN' ||
    String(rawRole).toUpperCase() === 'ADMIN';

  const normalizedRole = isAdmin
    ? 'ADMIN'
    : String(rawRole).toUpperCase();
  const normalizedPeran = isAdmin
    ? 'admin'
    : String((profileRow && profileRow.peran) || rawRole || 'guru').toLowerCase();

  const dibuat =
    (profileRow && (profileRow.dibuat || profileRow.created_at)) ||
    authUser.created_at ||
    new Date().toISOString();

  return {
    id: authUser.id,
    nama: displayName,
    name: displayName,
    nama_akun: displayName,
    full_name: displayName,
    email: authUser.email || '',
    peran: normalizedPeran,
    role: normalizedRole,
    isAdmin,
    dibuat,
    created_at: dibuat,
    avatar: meta.avatar || 'orange-cat',
    isDemo: false,
  };
}

/**
 * Mengambil atau membuat baris profil pengguna dari tabel `public.profiles`
 */
async function fetchOrEnsureProfile(authUser, fallbackName = '') {
  if (!supabase || !authUser || !authUser.id) {
    return buildNormalizedUser(authUser);
  }

  try {
    const { data: existingProfile, error: selectErr } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', authUser.id)
      .maybeSingle();

    if (!selectErr && existingProfile) {
      return buildNormalizedUser(authUser, existingProfile);
    }

    const meta = authUser.user_metadata || {};
    const candidateName =
      (fallbackName && fallbackName.trim()) ||
      meta.nama_akun ||
      meta.full_name ||
      meta.nama ||
      meta.name ||
      (authUser.email ? authUser.email.split('@')[0] : 'Guru & Orang Tua Bukuna');

    const { data: insertedProfile, error: insertErr } = await supabase
      .from('profiles')
      .insert({
        id: authUser.id,
        nama_akun: candidateName,
      })
      .select('*')
      .maybeSingle();

    if (!insertErr && insertedProfile) {
      return buildNormalizedUser(authUser, insertedProfile);
    }

    return buildNormalizedUser(authUser, {
      id: authUser.id,
      nama_akun: candidateName,
      peran: 'guru',
      role: 'GURU',
    });
  } catch {
    return buildNormalizedUser(authUser);
  }
}

/**

 */
async function getCurrentSessionUser() {
  // Bersihkan key legacy lama jika Supabase sudah dikonfigurasi agar akun statis "Ibu Guru Rina" tidak muncul lagi
  if (isSupabaseConfigured) {
    try {
      const legacyRaw = localStorage.getItem('bukuna_user_v1');
      if (legacyRaw) {
        const parsed = JSON.parse(legacyRaw);
        if (parsed && (parsed.id === 'usr-1' || parsed.id === 'usr-demo')) {
          localStorage.removeItem('bukuna_user_v1');
        }
      }

    }

  if (isAuthInDemoMode()) {
    const storedDemo = readLocalJson(DEMO_STORAGE_KEYS.USER, {
      id: 'usr-1',

      name: 'Ibu Guru Rina',

      avatar: 'orange-cat',

    };

  try {

        runtimeConnectionFailed = true;
        const fallbackDemo = readLocalJson(DEMO_STORAGE_KEYS.USER, null);
        return { user: fallbackDemo, isDemoMode: true, error: null };

    const profileUser = await fetchOrEnsureProfile(sessionUser);

    if (isNetworkOrFetchError(err)) {

      const fallbackDemo = readLocalJson(DEMO_STORAGE_KEYS.USER, null);
      return { user: fallbackDemo, isDemoMode: true, error: null };

    return { user: null, isDemoMode: false, error: translateAuthError(err) };

}

/**
 * 2. DAFTAR AKUN BARU (Email + Kata Sandi + Nama Akun)
 */
async function registerWithEmail({ nama, email, password }) {
  const cleanName = String(nama || '').trim() || 'Guru & Orang Tua Bukuna';
  const cleanEmail = String(email || '').trim();

  if (isAuthInDemoMode()) {
    const newUser = {

    };
    const usersDb = readLocalJson(DEMO_STORAGE_KEYS.USERS_DB, []);
    const updatedDb = [
      ...usersDb.filter(
        (u) => (u.email || '').toLowerCase() !== cleanEmail.toLowerCase()
      ),
      { ...newUser, password },
    ];
    writeLocalJson(DEMO_STORAGE_KEYS.USERS_DB, updatedDb);
    writeLocalJson(DEMO_STORAGE_KEYS.USER, newUser);
    return {
      ok: true,
      user: newUser,
      needsEmailConfirmation: false,
      isDemoMode: true,
    };
  }

  try {
    const redirectUrl =
      typeof window !== 'undefined' && window.location
        ? `${window.location.origin}/masuk`
        : undefined;

    const { data, error } = await supabase.auth.signUp({
      email: cleanEmail,

      options: {
        emailRedirectTo: redirectUrl,
        data: {
          nama_akun: cleanName,
          nama: cleanName,
          name: cleanName,
        },
      },
    });

    if (error) {
      if (isNetworkOrFetchError(error)) {
        runtimeConnectionFailed = true;
        return registerWithEmail({ nama: cleanName, email: cleanEmail, password });
      }
      return {
        ok: false,
        error: translateAuthError(error),
      };
    }

    // Deteksi jika Supabase mengembalikan user dengan identities kosong (email sudah terdaftar)
    if (
      data &&
      data.user &&
      Array.isArray(data.user.identities) &&
      data.user.identities.length === 0
    ) {
      return {
        ok: false,
        error:
          'Alamat email ini sudah terdaftar. Silakan masuk melalui halaman Masuk atau gunakan Lupa Kata Sandi.',
      };
    }

    const hasActiveSession = Boolean(data && data.session && data.user);
    if (hasActiveSession) {
      const profileUser = await fetchOrEnsureProfile(data.user, cleanName);
      return {
        ok: true,
        user: profileUser,
        needsEmailConfirmation: false,
        isDemoMode: false,
      };

    return {
      ok: true,
      user: null,
      needsEmailConfirmation: true,
      isDemoMode: false,
      message: `Pendaftaran berhasil! Kami telah mengirimkan email konfirmasi ke ${cleanEmail}. Silakan buka kotak masuk email Anda dan klik tautan verifikasi sebelum masuk.`,
    };
  } catch (err) {
    if (isNetworkOrFetchError(err)) {
      runtimeConnectionFailed = true;
      return registerWithEmail({ nama: cleanName, email: cleanEmail, password });
    }
    return {
      ok: false,
      error: translateAuthError(err),
    };
  }
}

/**
 * 3. MASUK AKUN (Email + Kata Sandi)
 */
async function loginWithEmail({ email, password }) {
  const cleanEmail = String(email || '').trim();

  if (isAuthInDemoMode()) {
    const usersDb = readLocalJson(DEMO_STORAGE_KEYS.USERS_DB, []);
    const found = usersDb.find(
      (u) =>
        u.email && u.email.toLowerCase() === cleanEmail.toLowerCase()
    );

    if (found && found.password && found.password !== password) {
      return {
        ok: false,
        error: 'Email atau Kata Sandi belum tepat. Silakan periksa kembali.',
      };
    }

    const displayName =
      (found && (found.nama_akun || found.nama || found.name)) ||
      (cleanEmail.includes('@') ? cleanEmail.split('@')[0] : cleanEmail) ||
      'Guru Bukuna';

    const loggedUser = {
      id: (found && found.id) || `usr-${Date.now()}`,
      nama: displayName,
      name: displayName,
      nama_akun: displayName,
      email: cleanEmail,
      peran: (found && found.peran) || 'guru',
      avatar: 'orange-cat',
      isDemo: true,
    };

    writeLocalJson(DEMO_STORAGE_KEYS.USER, loggedUser);
    return {
      ok: true,
      user: loggedUser,
      isDemoMode: true,
    };
  }

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email: cleanEmail,
      password,
    });

    if (error) {
      if (isNetworkOrFetchError(error)) {
        runtimeConnectionFailed = true;
        return loginWithEmail({ email: cleanEmail, password });
      }
      return {
        ok: false,
        error: translateAuthError(error),
      };
    }

    const authUser = data && data.user ? data.user : null;
    if (!authUser) {
      return {
        ok: false,
        error: 'Gagal memuat sesi pengguna. Silakan coba masuk kembali.',
      };
    }

    const profileUser = await fetchOrEnsureProfile(authUser);
    return {
      ok: true,
      user: profileUser,
      isDemoMode: false,
    };
  } catch (err) {
    if (isNetworkOrFetchError(err)) {
      runtimeConnectionFailed = true;
      return loginWithEmail({ email: cleanEmail, password });
    }
    return {
      ok: false,
      error: translateAuthError(err),
    };
  }
}

/**
 * 6. LUPA KATA SANDI (Kirim Tautan Reset ke Email)
 */
async function sendPasswordReset(email) {
  const cleanEmail = String(email || '').trim();
  if (!cleanEmail) {
    return {
      ok: false,
      error: 'Mohon isi alamat Email terlebih dahulu untuk menerima tautan reset kata sandi.',
    };
  }

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(cleanEmail)) {
    return {
      ok: false,
      error: 'Format alamat Email belum valid (contoh: nama@email.com).',
    };
  }

  if (isAuthInDemoMode()) {
    return {
      ok: true,
      isDemoMode: true,
      message: `Mode Demo: Simulasi tautan pengaturan ulang kata sandi telah dikirim ke ${cleanEmail}.`,
    };
  }

  try {
    const redirectTo =
      typeof window !== 'undefined' && window.location
        ? `${window.location.origin}/masuk?reset=1`
        : undefined;

    const { error } = await supabase.auth.resetPasswordForEmail(cleanEmail, {
      redirectTo,
    });

    if (error) {
      if (isNetworkOrFetchError(error)) {
        runtimeConnectionFailed = true;
        return sendPasswordReset(cleanEmail);
      }
      return {
        ok: false,
        error: translateAuthError(error),
      };
    }

    return {
      ok: true,
      isDemoMode: false,
      message: `Tautan untuk mengatur ulang kata sandi telah dikirim ke ${cleanEmail}. Silakan periksa kotak masuk atau folder spam email Anda.`,
    };
  } catch (err) {
    if (isNetworkOrFetchError(err)) {
      runtimeConnectionFailed = true;
      return sendPasswordReset(cleanEmail);
    }
    return {
      ok: false,
      error: translateAuthError(err),
    };
  }
}

/**
 * 7. PERBARUI KATA SANDI BARU (Saat pengguna kembali dari tautan email reset password)
 */
async function updateUserPassword(newPassword) {
  if (!newPassword || String(newPassword).length < 8) {
    return {
      ok: false,
      error: 'Kata Sandi baru minimal terdiri dari 8 karakter.',
    };
  }

  if (isAuthInDemoMode()) {
    return {
      ok: true,
      message: 'Kata sandi berhasil diperbarui (Mode Demo).',
    };
  }

  try {
    const { error } = await supabase.auth.updateUser({
      password: String(newPassword),
    });
    if (error) {
      return {
        ok: false,
        error: translateAuthError(error),
      };
    }
    return {
      ok: true,
      message: 'Kata sandi Anda berhasil diperbarui! Silakan lanjutkan menggunakan BUKUNA.',
    };
  } catch (err) {
    return {
      ok: false,
      error: translateAuthError(err),
    };
  }
}

/**
 * 8. LANGGANAN PERUBAHAN SESI AUTH SUPABASE
 */
function subscribeAuthChanges(callback) {
  if (isAuthInDemoMode() || !supabase) {
    return () => {};
  }

  const { data } = supabase.auth.onAuthStateChange(async (event, session) => {
    const authUser = session && session.user ? session.user : null;
    if (!authUser) {
      callback(event, null);
      return;
    }
    const profileUser = await fetchOrEnsureProfile(authUser);
    callback(event, profileUser);
  });

  return () => {
    if (data && data.subscription) {
      data.subscription.unsubscribe();
    }
  };
}

 * - Menyimpan ulasan utama (`parent_id: null`, `rating: 1..5`) maupun balasan komentar (`parent_id: <id>`).
 * - Menghapus ulasan atau balasan milik user yang sedang login (`user.id === item.user_id`).
 * - Mendukung fallback penyimpanan lokal (`localStorage`) jika berjalan di Mode Demo / preview.html.

function readLocalComments() {
  try {
    const raw = localStorage.getItem(LOCAL_COMMENTS_KEY);
    if (!raw) return INITIAL_DEMO_COMMENTS;
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : INITIAL_DEMO_COMMENTS;
  } catch {
    return INITIAL_DEMO_COMMENTS;
  }
}

function writeLocalComments(list) {
  try {
    localStorage.setItem(LOCAL_COMMENTS_KEY, JSON.stringify(list));
  } catch {
    // Abaikan jika localStorage penuh
  }
}

function normalizeCommentRow(row, fallbackAuthorName = 'Orang Tua / Guru Bukuna') {
  if (!row) return null;

  let profileObj = row.profiles || null;
  if (Array.isArray(profileObj)) {
    profileObj = profileObj[0] || null;
  }

  const authorName =
    (profileObj && (profileObj.nama_akun || profileObj.nama || profileObj.name)) ||
    row.author_name ||
    fallbackAuthorName;

  const authorRole = (profileObj && profileObj.peran) || row.author_role || 'guru';
  const parentId =
    row.parent_id !== undefined && row.parent_id !== null && String(row.parent_id).trim() !== ''
      ? String(row.parent_id)
      : null;

  const normalizedRating =
    row.rating === null || row.rating === undefined
      ? parentId
        ? null
        : 5
      : Math.max(1, Math.min(5, Number(row.rating) || 5));

  return {
    id: String(row.id),
    story_id: String(row.story_id),
    user_id: String(row.user_id || ''),
    parent_id: parentId,
    rating: normalizedRating,
    comment: String(row.comment || '').trim(),
    created_at: row.created_at || new Date().toISOString(),
    author_name: authorName,
    author_role: authorRole,
  };
}

/**
 * 1. AMBIL DAFTAR ULASAN & BALASAN BERDASARKAN story_id (+ Join profiles)
 */
async function fetchStoryComments(storyId) {
  if (!storyId) return { ok: true, comments: [] };

  if (isAuthInDemoMode() || !isSupabaseConfigured || !supabase) {
    const allLocal = readLocalComments();
    const filtered = allLocal
      .filter((c) => c && c.story_id === storyId)
      .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
      .map((c) => normalizeCommentRow(c))
      .filter(Boolean);
    return { ok: true, comments: filtered, isLocal: true };
  }

  try {
    // Query utama: join story_comments dengan profiles termasuk parent_id
    const { data, error } = await supabase
      .from('story_comments')
      .select(
        `
        id,
        story_id,
        user_id,
        parent_id,
        rating,
        comment,
        created_at,
        profiles (
          id,
          nama_akun,
          peran
        )
      `
      )
      .eq('story_id', storyId)
      .order('created_at', { ascending: false });

    if (!error && Array.isArray(data)) {
      const normalized = data.map((row) => normalizeCommentRow(row)).filter(Boolean);
      return { ok: true, comments: normalized, isLocal: false };
    }

    // Fallback kedua jika relasi foreign key di Supabase disetel ke auth.users (bukan public.profiles langsung):
    // ambil story_comments lalu gabungkan manual dengan query ke tabel profiles
    const { data: rawComments, error: rawErr } = await supabase
      .from('story_comments')
      .select('id, story_id, user_id, parent_id, rating, comment, created_at')
      .eq('story_id', storyId)
      .order('created_at', { ascending: false });

    if (rawErr) {
      return {
        ok: false,
        comments: [],
        error: 'Belum dapat memuat ulasan dari database. Pastikan tabel story_comments sudah dijalankan di Supabase.',
      };
    }

    const rows = Array.isArray(rawComments) ? rawComments : [];
    const userIds = Array.from(
      new Set(rows.map((r) => r.user_id).filter(Boolean))
    );

    const profilesMap = {};
    if (userIds.length > 0) {
      const { data: profRows } = await supabase
        .from('profiles')
        .select('id, nama_akun, peran')
        .in('id', userIds);

      if (Array.isArray(profRows)) {
        profRows.forEach((p) => {
          if (p && p.id) profilesMap[p.id] = p;
        });
      }
    }

    const merged = rows
      .map((r) =>
        normalizeCommentRow({
          ...r,
          profiles: profilesMap[r.user_id] || null,
        })
      )
      .filter(Boolean);

    return { ok: true, comments: merged, isLocal: false };
  } catch {
    return {
      ok: false,
      comments: [],
      error: 'Terjadi kendala jaringan saat memuat ulasan cerita.',
    };
  }
}

/**
 * 2. TAMBAH ULASAN UTAMA ATAU BALASAN KOMENTAR (story_id, user_id, parent_id, rating, comment)
 */
async function addStoryComment({
  storyId,
  user,
  rating = 5,
  comment,
  parentId = null,
}) {
  if (!user || !user.id) {
    return {
      ok: false,
      error: 'Silakan masuk ke akun Guru / Orang Tua terlebih dahulu untuk menulis komentar.',
    };
  }

  const cleanComment = String(comment || '').trim();
  if (cleanComment.length < 2) {
    return {
      ok: false,
      error: 'Mohon tulis catatan atau balasan minimal 2 karakter.',
    };
  }

  if (cleanComment.length > 1000) {
    return {
      ok: false,
      error: 'Teks komentar maksimal 1.000 karakter.',
    };
  }

  const cleanParentId =
    parentId !== undefined && parentId !== null && String(parentId).trim() !== ''
      ? String(parentId).trim()
      : null;

  // Untuk balasan (parent_id !== null), rating bintang tidak diperlukan di UI,
  // namun kita tetap menyiapkan fallback nilai valid (5) bila kolom rating di DB pengguna masih berstatus NOT NULL.
  const safeRating =
    rating === null || rating === undefined
      ? 5
      : Math.max(1, Math.min(5, Number(rating) || 5));

  const authorName =
    user.nama_akun || user.nama || user.name || 'Orang Tua / Guru Bukuna';
  const authorRole = user.peran || 'guru';

  if (isAuthInDemoMode() || !isSupabaseConfigured || !supabase) {
    const newEntry = {
      id: `local-cmt-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      story_id: storyId,
      user_id: user.id,
      parent_id: cleanParentId,
      rating: cleanParentId ? null : safeRating,
      comment: cleanComment,
      created_at: new Date().toISOString(),
      author_name: authorName,
      author_role: authorRole,
    };
    const current = readLocalComments();
    writeLocalComments([newEntry, ...current]);
    return {
      ok: true,
      comment: normalizeCommentRow(newEntry, authorName),
    };
  }

  try {
    const payload = {
      story_id: storyId,
      user_id: user.id,
      parent_id: cleanParentId,
      rating: safeRating,
      comment: cleanComment,
    };

    const { data, error } = await supabase
      .from('story_comments')
      .insert(payload)
      .select(
        `
        id,
        story_id,
        user_id,
        parent_id,
        rating,
        comment,
        created_at,
        profiles (
          id,
          nama_akun,
          peran
        )
      `
      )
      .maybeSingle();

    if (!error && data) {
      return {
        ok: true,
        comment: normalizeCommentRow(data, authorName),
      };
    }

    // Fallback insert tanpa relational select jika FK join langsung belum terbaca oleh PostgREST cache
    const { data: fallbackData, error: fallbackErr } = await supabase
      .from('story_comments')
      .insert(payload)
      .select('id, story_id, user_id, parent_id, rating, comment, created_at')
      .maybeSingle();

    if (fallbackErr) {
      return {
        ok: false,
        error:
          fallbackErr.message ||
          'Gagal menyimpan komentar ke Supabase. Pastikan kolom parent_id sudah ada di tabel story_comments.',
      };
    }

    return {
      ok: true,
      comment: normalizeCommentRow(
        {
          ...(fallbackData || payload),
          id: (fallbackData && fallbackData.id) || `cmt-${Date.now()}`,
          created_at:
            (fallbackData && fallbackData.created_at) || new Date().toISOString(),
          profiles: {
            id: user.id,
            nama_akun: authorName,
            peran: authorRole,
          },
        },
        authorName
      ),
    };
  } catch {
    return {
      ok: false,
      error: 'Tidak dapat mengirim komentar saat ini. Periksa koneksi internet Anda.',
    };
  }
}

/**
 * 3. HAPUS ULASAN ATAU BALASAN MILIK PENGGUNA SENDIRI (user.id === comment.user_id)
 */
async function deleteStoryComment({ commentId, userId }) {
  if (!commentId || !userId) {
    return {
      ok: false,
      error: 'Anda tidak memiliki akses untuk menghapus komentar ini.',
    };
  }

  if (isAuthInDemoMode() || !isSupabaseConfigured || !supabase) {
    const current = readLocalComments();
    const next = current.filter(
      (c) =>
        !(c.id === commentId && String(c.user_id) === String(userId)) &&
        c.parent_id !== commentId
    );
    writeLocalComments(next);
    return { ok: true };
  }

  try {
    const { error } = await supabase
      .from('story_comments')
      .delete()
      .eq('id', commentId)
      .eq('user_id', userId);

    if (error) {
      return {
        ok: false,
        error: error.message || 'Gagal menghapus komentar dari database.',
      };
    }

    return { ok: true };
  } catch {
    return {
      ok: false,
      error: 'Terjadi kendala jaringan saat menghapus komentar.',
    };
  }
}

/**
 * Menghasilkan daftar kategori tema yang memiliki minimal 1 cerita pada daftar cerita aktif.
 * Dengan 2 cerita bawaan saat ini, menghasilkan: ['Semua Cerita', 'Petualangan', 'Fantasi'].
 * Jika pengguna menerbitkan cerita baru di tema lain (mis. Persahabatan / Keluarga / Alam/Lingkungan),
 * chip tema tersebut otomatis ikut muncul.
 */
function getAvailableCategories(storiesList = [], includeAll = true) {
  const activeThemes = new Set(
    (storiesList || []).map((s) => s && s.kategori).filter(Boolean)
  );
  const available = CATEGORIES.filter(
    (cat) => cat !== 'Semua Cerita' && activeThemes.has(cat)
  );
  (storiesList || []).forEach((s) => {
    if (
      s &&
      s.kategori &&
      !CATEGORIES.includes(s.kategori) &&
      !available.includes(s.kategori)
    ) {
      available.push(s.kategori);
    }
  });
  return includeAll ? ['Semua Cerita', ...available] : available;
}

/**
 * Modul Penyimpanan Cerita & Gambar Tanpa Backend (src/services/storyStorage.js)
 * - Metadata & teks cerita disimpan di localStorage (dan disinkronkan ke IndexedDB)
 * - Gambar sampul & halaman disimpan di IndexedDB sebagai Blob asli
 * - Ditampilkan lewat URL.createObjectURL(blob) dan dibebaskan dengan URL.revokeObjectURL(url)
 * - Mendukung Ekspor (.json dengan gambar base64) dan Impor (.json kembali ke IndexedDB Blob)
 */

const DB_NAME = 'bukuna_stories_db_v1';
const DB_VERSION = 1;
const STORE_IMAGES = 'story_images';
const LS_MY_STORIES_KEY = 'bukuna_my_stories_v1';

// Cache URL.createObjectURL di memori agar komponen dapat menampilkan Blob secara instan
const objectUrlCache = new Map();
const imageListeners = new Map();
const changeListeners = new Set();

function notifyStoryStorageChanged() {
  changeListeners.forEach((listener) => {
    try {
      listener();
    } catch {
      // Abaikan error listener
    }
  });
}

function subscribeStoryStorage(listener) {
  changeListeners.add(listener);
  return () => changeListeners.delete(listener);
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') {
      reject(new Error('IndexedDB tidak tersedia di peramban ini.'));
      return;
    }
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(STORE_IMAGES)) {
        db.createObjectStore(STORE_IMAGES);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('Gagal membuka IndexedDB.'));
  });
}

function sanitizeText(str, maxLen = 5000) {
  if (typeof str !== 'string') return '';
  return str.slice(0, maxLen);
}

function migrateAgeLabel(rawUsia) {
  const str = typeof rawUsia === 'string' ? rawUsia.trim() : '';
  const match = str.match(/(\d+)\s*-\s*(\d+)/);
  if (match) {
    const minAge = Number(match[1]);
    if (minAge >= 5) {
      return '5-6 Tahun';
    }
    return '4-5 Tahun';
  }
  return '4-5 Tahun';
}

function extractAgeGroup(usiaStr) {
  const migrated = migrateAgeLabel(usiaStr);
  return migrated.startsWith('5-6') ? '5-6' : '4-5';
}

function isIndexedDbImageId(val) {
  return typeof val === 'string' && val.startsWith('idb:');
}

/**
 * Menyimpan Blob gambar ke IndexedDB dan mengembalikan ID unik ("idb:img_...")
 */
async function saveImage(blob, customId = null) {
  if (!blob) return '';
  const imageId =
    customId && isIndexedDbImageId(customId)
      ? customId
      : `idb:img_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;

  try {
    const db = await openDatabase();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_IMAGES, 'readwrite');
      const store = tx.objectStore(STORE_IMAGES);
      store.put(blob, imageId);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });

    // Jika sebelumnya ada objectURL untuk imageId ini, bebaskan dulu
    if (objectUrlCache.has(imageId)) {
      try {
        URL.revokeObjectURL(objectUrlCache.get(imageId));
      } catch {
        // Abaikan
      }
    }

    const objUrl = URL.createObjectURL(blob);
    objectUrlCache.set(imageId, objUrl);

    if (imageListeners.has(imageId)) {
      imageListeners.get(imageId).forEach((cb) => cb(objUrl));
    }

    return imageId;
  } catch (err) {
    if (err && (err.name === 'QuotaExceededError' || err.code === 22)) {
      const quotaErr = new Error(
        'Penyimpanan peramban sudah penuh. Hapus beberapa cerita atau gambar lama untuk melanjutkan.'
      );
      quotaErr.isQuotaError = true;
      throw quotaErr;
    }
    throw err;
  }
}

/**
 * Mengambil Blob dan ObjectURL dari IndexedDB berdasarkan imageId
 */
async function getImage(imageId) {
  if (!imageId) return { blob: null, url: '' };
  if (!isIndexedDbImageId(imageId)) {
    return { blob: null, url: imageId };
  }

  try {
    const db = await openDatabase();
    const blob = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_IMAGES, 'readonly');
      const store = tx.objectStore(STORE_IMAGES);
      const req = store.get(imageId);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });

    if (!blob) {
      return { blob: null, url: '' };
    }

    let url = objectUrlCache.get(imageId);
    if (!url) {
      url = URL.createObjectURL(blob);
      objectUrlCache.set(imageId, url);
      if (imageListeners.has(imageId)) {
        imageListeners.get(imageId).forEach((cb) => cb(url));
      }
    }
    return { blob, url };
  } catch {
    return { blob: null, url: '' };
  }
}

/**
 * Mengambil ObjectURL yang sudah di-cache di memori (sinkron)
 */
function getCachedImageUrl(imageId) {
  if (!imageId) return '';
  if (!isIndexedDbImageId(imageId)) return imageId;
  return objectUrlCache.get(imageId) || '';
}

/**
 * Berlangganan perubahan ObjectURL untuk imageId tertentu
 */
function subscribeImageUrl(imageId, callback) {
  if (!isIndexedDbImageId(imageId)) return () => {};
  if (!imageListeners.has(imageId)) {
    imageListeners.set(imageId, new Set());
  }
  const set = imageListeners.get(imageId);
  set.add(callback);

  // Trigger pemuatan asinkron jika belum ada di cache
  if (!objectUrlCache.has(imageId)) {
    getImage(imageId).then(({ url }) => {
      if (url && set.has(callback)) {
        callback(url);
      }
    });
  }

  return () => {
    set.delete(callback);
  };
}

/**
 * Menghapus gambar dari IndexedDB dan membebaskan URL.revokeObjectURL
 */
async function deleteImage(imageId) {
  if (!isIndexedDbImageId(imageId)) return;
  if (objectUrlCache.has(imageId)) {
    try {
      URL.revokeObjectURL(objectUrlCache.get(imageId));
    } catch {
      // Abaikan
    }
    objectUrlCache.delete(imageId);
  }
  try {
    const db = await openDatabase();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_IMAGES, 'readwrite');
      const store = tx.objectStore(STORE_IMAGES);
      store.delete(imageId);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch {
    // Abaikan jika gagal hapus
  }
}

/**
 * Mengambil seluruh kunci gambar di IndexedDB (untuk verifikasi dan pembersihan)
 */
async function getAllIndexedDbImageKeys() {
  try {
    const db = await openDatabase();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_IMAGES, 'readonly');
      const store = tx.objectStore(STORE_IMAGES);
      const req = store.getAllKeys();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch {
    return [];
  }
}

function readRawStories() {
  try {
    const raw = localStorage.getItem(LS_MY_STORIES_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];
    let needsMigration = false;
    const migratedList = parsed
      .filter((s) => s && typeof s === 'object')
      .map((s) => {
        const nextUsia = migrateAgeLabel(s.usia || s.kelompokUsia);
        const nextKelompok = extractAgeGroup(nextUsia);
        if (s.usia !== nextUsia || s.kelompokUsia !== nextKelompok) {
          needsMigration = true;
          return { ...s, usia: nextUsia, kelompokUsia: nextKelompok };
        }
        return s;
      });
    if (needsMigration) {
      try {
        localStorage.setItem(LS_MY_STORIES_KEY, JSON.stringify(migratedList));
      } catch {
        // Abaikan jika penyimpanan penuh
      }
    }
    return migratedList;
  } catch {
    return [];
  }
}

function writeRawStories(storiesList) {
  try {
    localStorage.setItem(LS_MY_STORIES_KEY, JSON.stringify(storiesList));
  } catch (err) {
    if (err && (err.name === 'QuotaExceededError' || err.code === 22)) {
      const quotaErr = new Error(
        'Penyimpanan teks cerita penuh. Hapus cerita lama yang tidak terpakai terlebih dahulu.'
      );
      quotaErr.isQuotaError = true;
      throw quotaErr;
    }
    throw err;
  }
}

function collectStoryImageIds(story) {
  const ids = new Set();
  if (!story) return ids;
  if (isIndexedDbImageId(story.cover)) {
    ids.add(story.cover);
  }
  if (Array.isArray(story.pages)) {
    story.pages.forEach((p) => {
      if (p && isIndexedDbImageId(p.gambar)) {
        ids.add(p.gambar);
      }
    });
  }
  if (story.quiz && Array.isArray(story.quiz.questions)) {
    story.quiz.questions.forEach((q) => {
      if (!q) return;
      if (q.media && isIndexedDbImageId(q.media.gambar)) {
        ids.add(q.media.gambar);
      }
      if (Array.isArray(q.options)) {
        q.options.forEach((opt) => {
          if (opt && isIndexedDbImageId(opt.gambar)) {
            ids.add(opt.gambar);
          }
        });
      }
      if (Array.isArray(q.sequence)) {
        q.sequence.forEach((seq) => {
          if (seq && isIndexedDbImageId(seq.gambar)) {
            ids.add(seq.gambar);
          }
        });
      }
    });
  }
  return ids;
}

function normalizeQuizObject(rawQuiz, storyTitle) {
  if (!rawQuiz || typeof rawQuiz !== 'object') return null;
  if (!Array.isArray(rawQuiz.questions) || rawQuiz.questions.length === 0) return null;

  const judul = sanitizeText(rawQuiz.judul || `Kuis ${storyTitle}`, 80);
  const questions = rawQuiz.questions
    .slice(0, 10)
    .map((q, qIdx) => {
      if (!q || typeof q !== 'object') return null;
      const qType = q.type === 'order-story' ? 'order-story' : 'pick-image';
      const prompt = sanitizeText(
        q.prompt || `Pertanyaan ${qIdx + 1} tentang ${storyTitle}`,
        240
      );
      const voiceText = sanitizeText(q.voiceText || prompt, 300);
      const hint = sanitizeText(
        q.hint || 'Perhatikan baik-baik gambar pada halaman cerita tadi ya!',
        240
      );

      const baseQuestion = {
        id: q.id || `q-usr-${qIdx + 1}-${Date.now()}`,
        type: qType,
        prompt,
        voiceText,
        hint,
      };

      if (q.media && typeof q.media === 'object') {
        baseQuestion.media = {
          emoji: sanitizeText(q.media.emoji || '📖', 16),
          gambar: q.media.gambar || '',
          label: sanitizeText(q.media.label || '', 120),
        };
      }

      if (qType === 'order-story') {
        const rawSeq = Array.isArray(q.sequence) ? q.sequence : [];
        const sequence = rawSeq.slice(0, 3).map((seq, sIdx) => ({
          id: (seq && seq.id) || `seq-${qIdx + 1}-${sIdx + 1}`,
          label: sanitizeText(
            (seq && seq.label) || `Kejadian ${sIdx + 1}`,
            100
          ),
          gambar: (seq && seq.gambar) || '',
          emoji: sanitizeText((seq && seq.emoji) || '📖', 16),
          correctOrder: Number(seq && seq.correctOrder) || sIdx + 1,
        }));
        baseQuestion.sequence = sequence;
      } else {
        const rawOpts = Array.isArray(q.options) ? q.options : [];
        const options = rawOpts.slice(0, 4).map((opt, oIdx) => ({
          id: (opt && opt.id) || `opt-${qIdx + 1}-${oIdx + 1}`,
          label: sanitizeText((opt && opt.label) || `Pilihan ${oIdx + 1}`, 100),
          gambar: (opt && opt.gambar) || '',
          emoji: sanitizeText((opt && opt.emoji) || '🌟', 16),
          isCorrect: Boolean(opt && opt.isCorrect),
        }));
        if (options.length > 0 && !options.some((o) => o.isCorrect)) {
          options[0].isCorrect = true;
        }
        baseQuestion.options = options;
      }

      return baseQuestion;
    })
    .filter(Boolean);

  if (questions.length === 0) return null;
  return {
    judul,
    questions,
  };
}

function normalizeStoryObject(input, existing = null) {
  const now = new Date().toISOString();
  const id =
    (existing && existing.id) ||
    (typeof input.id === 'string' && input.id.trim()
      ? input.id.trim()
      : `cerita-ku-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`);

  const judul = sanitizeText(input.judul || (existing && existing.judul) || 'Cerita Tanpa Judul', 60);
  const kategori = sanitizeText(input.kategori || (existing && existing.kategori) || 'Petualangan', 40);
  const rawUsia = input.usia || (existing && existing.usia) || '4-5 Tahun';
  const usia = migrateAgeLabel(sanitizeText(rawUsia, 30));
  const kelompokUsia = extractAgeGroup(usia);
  const sinopsis = sanitizeText(
    input.sinopsis !== undefined ? input.sinopsis : (existing && existing.sinopsis) || '',
    1000
  );
  const cover =
    input.cover !== undefined
      ? input.cover
      : (existing && existing.cover) || 'cat-magic-forest';
  const coverAlt = sanitizeText(
    input.coverAlt !== undefined ? input.coverAlt : (existing && existing.coverAlt) || '',
    200
  );

  const rawPages = Array.isArray(input.pages)
    ? input.pages
    : existing && Array.isArray(existing.pages)
    ? existing.pages
    : [{ id: 'hal-1', gambar: '', teks: '', alt: '' }];

  const pages = rawPages.slice(0, 30).map((p, idx) => ({
    id: (p && p.id) || `hal-${idx + 1}-${Date.now()}`,
    halaman: idx + 1,
    gambar: (p && p.gambar) || '',
    teks: sanitizeText((p && p.teks) || '', 2000),
    alt: sanitizeText((p && p.alt) || '', 200),
  }));

  if (pages.length === 0) {
    pages.push({ id: `hal-1-${Date.now()}`, halaman: 1, gambar: '', teks: '', alt: '' });
  }

  const status = input.status === 'terbit' ? 'terbit' : 'draf';
  const penulis = sanitizeText(
    input.penulis || (existing && existing.penulis) || 'Guru & Orang Tua Bukuna',
    80
  );

  const rawQuizInput =
    input.quiz !== undefined ? input.quiz : existing ? existing.quiz : null;
  const quiz = normalizeQuizObject(rawQuizInput, judul);

  return {
    id,
    judul,
    kategori,
    usia,
    kelompokUsia,
    sinopsis,
    cover,
    coverAlt,
    pages,
    quiz,
    status,
    penulis,
    dibuat: (existing && existing.dibuat) || input.dibuat || now,
    diubah: now,
    sumber: 'pengguna',
  };
}

/**
 * Mengambil seluruh daftar cerita buatan pengguna, diurutkan dari yang terbaru diubah
 */
function getMyStories() {
  const list = readRawStories();
  return list.sort((a, b) => {
    const tA = new Date(a.diubah || a.dibuat || 0).getTime();
    const tB = new Date(b.diubah || b.dibuat || 0).getTime();
    return tB - tA;
  });
}

/**
 * Mengambil satu cerita buatan pengguna berdasarkan ID
 */
function getStoryById(id) {
  if (!id) return null;
  const list = readRawStories();
  return list.find((s) => s.id === id) || null;
}

/**
 * Membuat cerita baru dan menyimpannya
 */
function createStory(storyData) {
  const list = readRawStories();
  const normalized = normalizeStoryObject(storyData || {});
  const filtered = list.filter((s) => s.id !== normalized.id);
  writeRawStories([normalized, ...filtered]);
  notifyStoryStorageChanged();
  return normalized;
}

/**
 * Memperbarui cerita berdasarkan ID dan membersihkan Blob gambar lama yang tidak lagi dipakai
 */
async function updateStory(id, storyData) {
  const list = readRawStories();
  const idx = list.findIndex((s) => s.id === id);
  const existing = idx !== -1 ? list[idx] : null;
  const oldImages = collectStoryImageIds(existing);

  const updated = normalizeStoryObject({ ...storyData, id }, existing);
  const newImages = collectStoryImageIds(updated);

  if (idx !== -1) {
    list[idx] = updated;
  } else {
    list.unshift(updated);
  }
  writeRawStories(list);

  // Hapus gambar lama yang sudah diganti/dihapus jika tidak dipakai cerita lain
  const otherStories = list.filter((s) => s.id !== id);
  const usedElsewhere = new Set();
  otherStories.forEach((s) => {
    collectStoryImageIds(s).forEach((imgId) => usedElsewhere.add(imgId));
  });

  for (const oldImgId of oldImages) {
    if (!newImages.has(oldImgId) && !usedElsewhere.has(oldImgId)) {
      await deleteImage(oldImgId);
    }
  }

  notifyStoryStorageChanged();
  return updated;
}

/**
 * Menghapus cerita beserta seluruh Blob gambarnya di IndexedDB
 */
async function deleteStory(id) {
  const list = readRawStories();
  const target = list.find((s) => s.id === id);
  const remaining = list.filter((s) => s.id !== id);
  writeRawStories(remaining);

  if (target) {
    const targetImages = collectStoryImageIds(target);
    const usedElsewhere = new Set();
    remaining.forEach((s) => {
      collectStoryImageIds(s).forEach((imgId) => usedElsewhere.add(imgId));
    });

    for (const imgId of targetImages) {
      if (!usedElsewhere.has(imgId)) {
        await deleteImage(imgId);
      }
    }
  }

  notifyStoryStorageChanged();
  return true;
}

/**
 * Memuat awal seluruh gambar cerita pengguna ke cache ObjectURL
 */
async function preloadAllStoryImages() {
  const list = readRawStories();
  const allIds = new Set();
  list.forEach((s) => {
    collectStoryImageIds(s).forEach((id) => allIds.add(id));
  });
  await Promise.all(Array.from(allIds).map((id) => getImage(id)));
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Gagal membaca Blob gambar.'));
    reader.readAsDataURL(blob);
  });
}

async function dataUrlToBlob(dataUrl) {
  const res = await fetch(dataUrl);
  return await res.blob();
}

/**
 * Mengekspor cerita (termasuk kuis buatan pengguna) ke format JSON lengkap dengan gambar Base64
 */
async function exportStoryToJson(id) {
  const story = getStoryById(id);
  if (!story) {
    throw new Error('Cerita tidak ditemukan untuk diekspor.');
  }

  const exportedStory = JSON.parse(JSON.stringify(story));
  const imagesDataUrlMap = {};

  const allImgIds = collectStoryImageIds(exportedStory);
  for (const imgId of allImgIds) {
    if (isIndexedDbImageId(imgId)) {
      const { blob } = await getImage(imgId);
      if (blob) {
        imagesDataUrlMap[imgId] = await blobToDataUrl(blob);
      }
    }
  }

  if (isIndexedDbImageId(exportedStory.cover) && imagesDataUrlMap[exportedStory.cover]) {
    exportedStory.coverDataUrl = imagesDataUrlMap[exportedStory.cover];
  }

  if (Array.isArray(exportedStory.pages)) {
    for (let i = 0; i < exportedStory.pages.length; i++) {
      const page = exportedStory.pages[i];
      if (page && isIndexedDbImageId(page.gambar) && imagesDataUrlMap[page.gambar]) {
        page.gambarDataUrl = imagesDataUrlMap[page.gambar];
      }
    }
  }

  if (exportedStory.quiz && Array.isArray(exportedStory.quiz.questions)) {
    exportedStory.quiz.questions.forEach((q) => {
      if (!q) return;
      if (q.media && isIndexedDbImageId(q.media.gambar) && imagesDataUrlMap[q.media.gambar]) {
        q.media.gambarDataUrl = imagesDataUrlMap[q.media.gambar];
      }
      if (Array.isArray(q.options)) {
        q.options.forEach((opt) => {
          if (opt && isIndexedDbImageId(opt.gambar) && imagesDataUrlMap[opt.gambar]) {
            opt.gambarDataUrl = imagesDataUrlMap[opt.gambar];
          }
        });
      }
      if (Array.isArray(q.sequence)) {
        q.sequence.forEach((seq) => {
          if (seq && isIndexedDbImageId(seq.gambar) && imagesDataUrlMap[seq.gambar]) {
            seq.gambarDataUrl = imagesDataUrlMap[seq.gambar];
          }
        });
      }
    });
  }

  exportedStory.imagesDataUrlMap = imagesDataUrlMap;

  const payload = {
    app: 'BUKUNA',
    version: 2,
    exportedAt: new Date().toISOString(),
    story: exportedStory,
  };

  return JSON.stringify(payload, null, 2);
}

/**
 * Mengimpor cerita & kuis dari file/teks JSON (memvalidasi struktur, mengonversi base64 kembali ke Blob di IndexedDB)
 */
async function importStoryFromJson(jsonInput) {
  let parsed = null;
  try {
    parsed = typeof jsonInput === 'string' ? JSON.parse(jsonInput) : jsonInput;
  } catch {
    throw new Error('File JSON tidak valid atau rusak. Pastikan memilih file ekspor cerita BUKUNA (.json).');
  }

  const rawStory = parsed && parsed.story ? parsed.story : parsed;
  if (!rawStory || typeof rawStory !== 'object' || !rawStory.judul || !Array.isArray(rawStory.pages)) {
    throw new Error('Struktur file cerita tidak lengkap. Judul dan halaman cerita wajib ada.');
  }

  const oldToNewImageIdMap = {};
  const rawMap =
    rawStory.imagesDataUrlMap && typeof rawStory.imagesDataUrlMap === 'object'
      ? rawStory.imagesDataUrlMap
      : {};

  const resolveImportedImage = async (origVal, inlineDataUrl) => {
    if (origVal && oldToNewImageIdMap[origVal]) {
      return oldToNewImageIdMap[origVal];
    }
    const candidateDataUrl =
      typeof inlineDataUrl === 'string' && inlineDataUrl.startsWith('data:image/')
        ? inlineDataUrl
        : origVal && typeof rawMap[origVal] === 'string' && rawMap[origVal].startsWith('data:image/')
        ? rawMap[origVal]
        : typeof origVal === 'string' && origVal.startsWith('data:image/')
        ? origVal
        : '';

    if (candidateDataUrl) {
      const blob = await dataUrlToBlob(candidateDataUrl);
      const newId = await saveImage(blob);
      if (origVal && isIndexedDbImageId(origVal)) {
        oldToNewImageIdMap[origVal] = newId;
      }
      return newId;
    }
    return origVal || '';
  };

  const coverValue =
    (await resolveImportedImage(rawStory.cover, rawStory.coverDataUrl)) ||
    'cat-magic-forest';

  const importedPages = [];
  for (let i = 0; i < Math.min(rawStory.pages.length, 30); i++) {
    const p = rawStory.pages[i] || {};
    const pageImg = await resolveImportedImage(p.gambar || '', p.gambarDataUrl);
    importedPages.push({
      id: p.id || `hal-${i + 1}-${Date.now()}`,
      halaman: i + 1,
      gambar: pageImg,
      teks: sanitizeText(p.teks || '', 2000),
      alt: sanitizeText(p.alt || '', 200),
    });
  }

  let importedQuiz = null;
  if (rawStory.quiz && Array.isArray(rawStory.quiz.questions)) {
    const clonedQuiz = JSON.parse(JSON.stringify(rawStory.quiz));
    for (let qi = 0; qi < clonedQuiz.questions.length; qi++) {
      const q = clonedQuiz.questions[qi];
      if (!q) continue;
      if (q.media && (q.media.gambar || q.media.gambarDataUrl)) {
        q.media.gambar = await resolveImportedImage(
          q.media.gambar,
          q.media.gambarDataUrl
        );
      }
      if (Array.isArray(q.options)) {
        for (let oi = 0; oi < q.options.length; oi++) {
          const opt = q.options[oi];
          if (opt && (opt.gambar || opt.gambarDataUrl)) {
            opt.gambar = await resolveImportedImage(
              opt.gambar,
              opt.gambarDataUrl
            );
          }
        }
      }
      if (Array.isArray(q.sequence)) {
        for (let si = 0; si < q.sequence.length; si++) {
          const seq = q.sequence[si];
          if (seq && (seq.gambar || seq.gambarDataUrl)) {
            seq.gambar = await resolveImportedImage(
              seq.gambar,
              seq.gambarDataUrl
            );
          }
        }
      }
    }
    importedQuiz = normalizeQuizObject(clonedQuiz, rawStory.judul);
  }

  // Jika ID sudah ada, gunakan kembali atau buat salinan
  const existing = getStoryById(rawStory.id);
  const targetId = existing
    ? `cerita-ku-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`
    : rawStory.id || `cerita-ku-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;

  const saved = createStory({
    id: targetId,
    judul: sanitizeText(rawStory.judul, 60),
    kategori: rawStory.kategori || 'Petualangan',
    usia: migrateAgeLabel(rawStory.usia || rawStory.kelompokUsia || '4-5 Tahun'),
    sinopsis: sanitizeText(rawStory.sinopsis || '', 1000),
    cover: coverValue,
    coverAlt: sanitizeText(rawStory.coverAlt || '', 200),
    pages: importedPages,
    quiz: importedQuiz,
    status: rawStory.status === 'terbit' ? 'terbit' : 'draf',
    penulis: sanitizeText(rawStory.penulis || 'Guru & Orang Tua Bukuna', 80),
  });

  return saved;
}

/**
 * Layanan Dashboard Admin & Katalog Cerita Supabase (/src/services/adminService.js)
 * - Mengelola katalog cerita di tabel `stories` Supabase (Fetch, Auto-Migrate dari initialStories jika kosong,
 *   Tambah Cerita Baru, Edit Cerita, dan Hapus Cerita).
 * - Mengonversi skema baris database `stories` (id, slug, title, synopsis, category, age_category,
 *   cover_url, moral_value, pages, content) ke format objek cerita BUKUNA yang kompatibel 100%
 *   dengan Beranda, Koleksi, Detail Cerita, dan Halaman Membaca.
 * - Mengelola Moderasi Ulasan & Komentar (`story_comments` join `profiles`).
 * - Mengambil Daftar Pengguna Terdaftar (`profiles`).
 */

const LOCAL_ADMIN_STORIES_KEY = 'bukuna_admin_stories_v1';
const LOCAL_COMMENTS_KEY = 'bukuna_story_comments_v1';

function slugifyStoryTitle(title) {
  const base = String(title || '')
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
  return base || `cerita-bukuna-${Date.now()}`;
}

function isUserAdmin(user) {
  if (!user) return false;
  return (
    user.isAdmin === true ||
    String(user.role || '').toUpperCase() === 'ADMIN' ||
    String(user.peran || '').toUpperCase() === 'ADMIN'
  );
}

/**
 * Mengonversi baris dari tabel `stories` Supabase (atau objek cerita lokal)
 * menjadi objek cerita BUKUNA standar yang dipakai seluruh komponen UI.
 */
function normalizeDbStoryToBukuna(row) {
  if (!row || typeof row !== 'object') return null;

  const slug = String(row.slug || row.id || slugifyStoryTitle(row.title || row.judul)).trim();
  const id = String(row.id || slug).trim();
  const judul = String(row.title || row.judul || 'Cerita Tanpa Judul').trim();
  const sinopsis = String(row.synopsis || row.sinopsis || '').trim();
  const kategori = String(row.category || row.kategori || 'Petualangan').trim();
  const rawUsia = String(row.age_category || row.usia || '4-5 Tahun').trim();
  const usia = migrateAgeLabel(rawUsia);
  const kelompokUsia = extractAgeGroup(usia);
  const cover = String(row.cover_url || row.cover || '/stories/kucing-hutan/cover.webp').trim();
  const pesanMoral = String(row.moral_value || row.pesanMoral || '').trim();

  let rawPages = [];
  if (Array.isArray(row.pages) && row.pages.length > 0) {
    rawPages = row.pages;
  } else if (typeof row.pages === 'string' && row.pages.trim().startsWith('[')) {
    try {
      const parsed = JSON.parse(row.pages);
      if (Array.isArray(parsed)) rawPages = parsed;
    } catch {
      rawPages = [];
    }
  }

  // Jika pages kosong tapi ada kolom content (teks per paragraf dipisah baris kosong), pecah menjadi halaman
  if (rawPages.length === 0 && typeof row.content === 'string' && row.content.trim()) {
    const paragraphs = row.content
      .split(/\n\s*\n/)
      .map((p) => p.trim())
      .filter(Boolean);
    rawPages = paragraphs.map((pText, idx) => ({
      halaman: idx + 1,
      gambar: cover,
      alt: `${judul} - Halaman ${idx + 1}`,
      teks: pText,
    }));
  }

  const pages =
    rawPages.length > 0
      ? rawPages.map((p, idx) => ({
          id: (p && p.id) || `hal-${idx + 1}`,
          halaman: idx + 1,
          gambar: (p && (p.gambar || p.image_url || p.image)) || cover,
          alt: (p && p.alt) || `${judul} - Halaman ${idx + 1}`,
          teks: (p && (p.teks || p.text || p.content)) || '',
        }))
      : [
          {
            id: 'hal-1',
            halaman: 1,
            gambar: cover,
            alt: judul,
            teks: sinopsis || 'Mari membaca cerita seru ini bersama-sama!',
          },
        ];

  return {
    id,
    slug,
    judul,
    title: judul,
    kategori,
    category: kategori,
    usia,
    age_category: usia,
    kelompokUsia,
    cover,
    cover_url: cover,
    coverAlt: row.coverAlt || judul,
    objectPosition: row.objectPosition || 'center center',
    featured: true,
    sinopsis,
    synopsis: sinopsis,
    pesanMoral,
    moral_value: pesanMoral,
    pages,
    content:
      typeof row.content === 'string' && row.content.trim()
        ? row.content
        : pages.map((p) => p.teks).join('\n\n'),
    created_at: row.created_at || new Date().toISOString(),
    sumber: 'katalog',
  };
}

/**
 * Mengonversi objek cerita BUKUNA ke payload baris tabel `public.stories` Supabase
 */
function buildDbStoryPayload(input) {
  const title = String(input.title || input.judul || 'Cerita Baru Bukuna').trim();
  const slug = String(input.slug || input.id || slugifyStoryTitle(title)).trim();
  const id = String(input.id || slug).trim();
  const synopsis = String(input.synopsis || input.sinopsis || '').trim();
  const category = String(input.category || input.kategori || 'Petualangan').trim();
  const age_category = migrateAgeLabel(
    String(input.age_category || input.usia || '4-5 Tahun').trim()
  );
  const cover_url = String(
    input.cover_url || input.cover || '/stories/kucing-hutan/cover.webp'
  ).trim();
  const moral_value = String(input.moral_value || input.pesanMoral || '').trim();

  let pages = [];
  if (Array.isArray(input.pages) && input.pages.length > 0) {
    pages = input.pages.map((p, idx) => ({
      halaman: idx + 1,
      gambar: (p && (p.gambar || p.image_url)) || cover_url,
      alt: (p && p.alt) || `${title} - Halaman ${idx + 1}`,
      teks: String((p && (p.teks || p.text)) || '').trim(),
    }));
  } else if (typeof input.content === 'string' && input.content.trim()) {
    const paragraphs = input.content
      .split(/\n\s*\n/)
      .map((p) => p.trim())
      .filter(Boolean);
    pages = paragraphs.map((pText, idx) => ({
      halaman: idx + 1,
      gambar: cover_url,
      alt: `${title} - Halaman ${idx + 1}`,
      teks: pText,
    }));
  }

  if (pages.length === 0) {
    pages = [
      {
        halaman: 1,
        gambar: cover_url,
        alt: title,
        teks: synopsis || 'Halaman pertama cerita.',
      },
    ];
  }

  const content = pages.map((p) => p.teks).join('\n\n');

  return {
    id,
    slug,
    title,
    synopsis,
    category,
    age_category,
    cover_url,
    moral_value,
    pages,
    content,
  };
}

function readLocalCatalogStories() {
  try {
    const raw = localStorage.getItem(LOCAL_ADMIN_STORIES_KEY);
    if (!raw) {
      return initialStories.map((s) =>
        normalizeDbStoryToBukuna({
          ...s,
          slug: s.id,
          title: s.judul,
          synopsis: s.sinopsis,
          category: s.kategori,
          age_category: s.usia,
          cover_url: s.cover,
          moral_value:
            s.id === 'petualangan-kucing-di-hutan-ajaib'
              ? 'Keberanian, sikap suka menolong sahabat, dan rasa syukur akan kehangatan rumah.'
              : 'Berbagi kebaikan sederhana dapat menghadirkan kebahagiaan bagi teman-teman di sekitar kita.',
        })
      );
    }
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed) || parsed.length === 0) {
      return initialStories.map((s) => normalizeDbStoryToBukuna(s));
    }
    return parsed.map((s) => normalizeDbStoryToBukuna(s)).filter(Boolean);
  } catch {
    return initialStories.map((s) => normalizeDbStoryToBukuna(s)).filter(Boolean);
  }
}

function writeLocalCatalogStories(list) {
  try {
    localStorage.setItem(LOCAL_ADMIN_STORIES_KEY, JSON.stringify(list));
  } catch {
    // Abaikan jika penyimpanan lokal penuh
  }
}

/**
 * 1. AMBIL KATALOG CERITA DARI TABEL `stories` SUPABASE
 * - Jika tabel `stories` masih kosong dan pengguna adalah Admin (atau kebijakan mengizinkan),
 *   otomatis migrasikan 2 cerita statis bawaan ke tabel `stories`.
 * - Jika tabel `stories` belum dibuat di Supabase, gunakan fallback cerita bawaan dengan aman.
 */
async function fetchCatalogStories({ autoMigrateIfEmpty = true } = {}) {
  const defaultInitialNormalized = initialStories
    .map((s) =>
      normalizeDbStoryToBukuna({
        ...s,
        slug: s.id,
        title: s.judul,
        synopsis: s.sinopsis,
        category: s.kategori,
        age_category: s.usia,
        cover_url: s.cover,
        moral_value:
          s.id === 'petualangan-kucing-di-hutan-ajaib'
            ? 'Keberanian, sikap suka menolong sahabat, dan rasa syukur akan kehangatan rumah.'
            : 'Berbagi kebaikan sederhana dapat menghadirkan kebahagiaan bagi teman-teman di sekitar kita.',
      })
    )
    .filter(Boolean);

  if (isAuthInDemoMode() || !isSupabaseConfigured || !supabase) {
    return {
      ok: true,
      stories: readLocalCatalogStories(),
      fromSupabase: false,
    };
  }

  try {
    const { data, error } = await supabase
      .from('stories')
      .select('*')
      .order('created_at', { ascending: true });

    if (error) {
      return {
        ok: true,
        stories: defaultInitialNormalized,
        fromSupabase: false,
        dbNotice:
          'Menggunakan data cerita statis bawaan (jalankan bagian tabel public.stories di supabase/schema.sql untuk mengaktifkan penyimpanan cerita di database).',
      };
    }

    if (Array.isArray(data) && data.length > 0) {
      const normalized = data.map((row) => normalizeDbStoryToBukuna(row)).filter(Boolean);
      return {
        ok: true,
        stories: normalized,
        fromSupabase: true,
      };
    }

    // Jika tabel `stories` di Supabase masih kosong (0 baris), coba migrasikan cerita bawaan
    if (autoMigrateIfEmpty) {
      const seedPayloads = defaultInitialNormalized.map((s) => buildDbStoryPayload(s));
      const { data: insertedData, error: seedError } = await supabase
        .from('stories')
        .upsert(seedPayloads, { onConflict: 'id' })
        .select('*');

      if (!seedError && Array.isArray(insertedData) && insertedData.length > 0) {
        return {
          ok: true,
          stories: insertedData.map((row) => normalizeDbStoryToBukuna(row)).filter(Boolean),
          fromSupabase: true,
          migrated: true,
        };
      }
    }

    return {
      ok: true,
      stories: defaultInitialNormalized,
      fromSupabase: true,
    };
  } catch {
    return {
      ok: true,
      stories: defaultInitialNormalized,
      fromSupabase: false,
    };
  }
}

/**
 * 2. SIMPAN (TAMBAH / EDIT) CERITA DI TABEL `stories` SUPABASE
 */
async function upsertCatalogStory(storyInput, isEdit = false) {
  const payload = buildDbStoryPayload(storyInput);

  if (isAuthInDemoMode() || !isSupabaseConfigured || !supabase) {
    const current = readLocalCatalogStories();
    const normalized = normalizeDbStoryToBukuna(payload);
    const existsIdx = current.findIndex((s) => s.id === normalized.id || s.slug === normalized.slug);
    let next;
    if (existsIdx !== -1) {
      next = current.map((s, idx) => (idx === existsIdx ? normalized : s));
    } else {
      next = [...current, normalized];
    }
    writeLocalCatalogStories(next);
    return { ok: true, story: normalized };
  }

  try {
    // Jika tabel di Supabase baru saja kosong dan Admin menambah cerita pertama,
    // pastikan 2 cerita bawaan juga ikut disinkronkan agar tidak hilang
    const { data: existingRows } = await supabase.from('stories').select('id').limit(5);
    if (Array.isArray(existingRows) && existingRows.length === 0) {
      const seedPayloads = initialStories.map((s) =>
        buildDbStoryPayload({
          ...s,
          moral_value:
            s.id === 'petualangan-kucing-di-hutan-ajaib'

      });

      .from('story_comments')
      .select('id, story_id, user_id, parent_id, rating, comment, created_at')
